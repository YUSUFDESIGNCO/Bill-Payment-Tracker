/* ============================================================
   DATE RANGE RESOLUTION — respects the user's First Day of Week
   setting from Settings/Profile.
   ============================================================ */
function resolveDateRange(key, customStart, customEnd){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const iso = dt => localDateISO(dt);
  const startOfDay = new Date(y,m,d);
  const fdow = (STORE.state.settings && Number.isFinite(STORE.state.settings.firstDayOfWeek)) ? STORE.state.settings.firstDayOfWeek : 0;
  switch(key){
    case 'today': return { start: iso(startOfDay), end: iso(startOfDay) };
    case 'this-week': {
      const dow = startOfDay.getDay();
      const offset = (dow - fdow + 7) % 7;
      const start = new Date(startOfDay); start.setDate(startOfDay.getDate() - offset);
      const end = new Date(start); end.setDate(start.getDate()+6);
      return { start: iso(start), end: iso(end) };
    }
    case 'this-month': return { start: iso(new Date(y,m,1)), end: iso(new Date(y,m+1,0)) };
    case 'last-month': return { start: iso(new Date(y,m-1,1)), end: iso(new Date(y,m,0)) };
    case 'this-quarter': {
      const q = Math.floor(m/3);
      return { start: iso(new Date(y,q*3,1)), end: iso(new Date(y,q*3+3,0)) };
    }
    case 'this-year': return { start: iso(new Date(y,0,1)), end: iso(new Date(y,11,31)) };
    case 'all': return { start: '0000-01-01', end: '9999-12-31' };
    case 'custom': return { start: customStart || iso(new Date(y,0,1)), end: customEnd || iso(startOfDay) };
    default: return { start: iso(new Date(y,0,1)), end: iso(new Date(y,11,31)) };
  }
}
function inRange(dateStr, start, end){
  const d = String(dateStr).slice(0,10);
  return d >= start && d <= end;
}

    if(next==='custom'){
      UI_STATE[pageKey].range = 'custom';
      onChange();
      return;
    }
    UI_STATE[pageKey].range = next;
    onChange();
  });
  const s = el.querySelector('.range-start'), e = el.querySelector('.range-end');
  const commitCustomRange = ()=>{
    const start = s ? s.value : UI_STATE[pageKey].customStart;

    onChange();
  };

  if(e) e.addEventListener('change', commitCustomRange);
}

/* Horizontal menu fit check: collapse to the drawer only when the menu
   items do not fit between the brand and the header actions. */
function updateNavCollapse(){
  const root = document.documentElement;
  const sidebar = document.getElementById('sidebar');
  const nav = document.getElementById('nav-container');
  if(!sidebar || !nav) return;
  if(sidebar.classList.contains('open')) closeSidebar(false);
  const fits = ()=> nav.getBoundingClientRect().width + 24 <= sidebar.getBoundingClientRect().width;
  root.classList.remove('nav-collapsed','nav-tight','nav-stacked');
  // 1) full size in one row  2) tighter spacing in one row
  // 3) own row under the header  4) own row, tighter, scrolls sideways if needed
  if(!fits()){
    root.classList.add('nav-tight');
    if(!fits()){
      root.classList.remove('nav-tight');
      root.classList.add('nav-stacked');
      if(!fits()) root.classList.add('nav-tight');
    }
  }
  syncSidebarAccessibility(false);
  const active = nav.querySelector('.nav-item.active');
  if(active && root.classList.contains('nav-stacked')){
    const sr = sidebar.getBoundingClientRect(), ar = active.getBoundingClientRect();
    if(ar.left < sr.left || ar.right > sr.right) sidebar.scrollLeft += (ar.left + ar.width/2) - (sr.left + sr.width/2);
  }
}

/* ---------- Toast ---------- */
function toast(msg, type, opts){
  opts = opts || {};
  const root = document.getElementById('toast-root');
  if(!root) return;
  const elx = document.createElement('div');
  elx.className = 'toast' + (type ? ' '+type : '');
  elx.setAttribute('role', type === 'error' ? 'alert' : 'status');
  const text = document.createElement('span');
  text.textContent = msg;
  elx.appendChild(text);
  let timer = null;
  const dismiss = ()=>{ clearTimeout(timer); elx.style.transition='opacity .25s, transform .25s'; elx.style.opacity='0'; elx.style.transform='translateY(6px)'; setTimeout(()=>elx.remove(), 260); };
  if(opts.actionLabel && typeof opts.onAction === 'function'){
    const act = document.createElement('button');
    act.type = 'button'; act.className = 'toast-action'; act.textContent = opts.actionLabel;
    act.addEventListener('click', ()=>{ dismiss(); opts.onAction(); });
    elx.appendChild(act);
  }
  const close = document.createElement('button');
  close.type = 'button'; close.className = 'toast-close'; close.setAttribute('aria-label', t('common.close')); close.innerHTML = '&times;';
  close.addEventListener('click', dismiss);
  elx.appendChild(close);
  root.appendChild(elx);
  while(root.children.length > 4) root.firstElementChild.remove();
  timer = setTimeout(dismiss, opts.duration || 3500);
}

    const box = document.getElementById('modal-box');
    const focusables = Array.from(box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'))
      .filter(elx => elx.offsetParent !== null);
    if(!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if(!box.contains(document.activeElement)){
      e.preventDefault();
      first.focus();
      return;
    }
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }

/* ---------- File download / CSV ---------- */
function downloadFile(filename, content, mime){
  try{
    const blob = new Blob([content], {type: mime || 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    return true;
  }catch(e){
    console.error('File download failed', e);
    return false;
  }
}
function toCSV(rows, columns){
  // UTF-8 BOM improves automatic Unicode detection in Excel and similar
  // spreadsheet applications. CRLF keeps the file broadly compatible.
  const esc = v=>{
    if(v===undefined || v===null) v='';
    v=String(v);
    // Neutralise spreadsheet formula injection: text that starts with = + - @ (or a
    // tab/CR) is prefixed with an apostrophe so Excel/Sheets show it as plain text.
    // Plain numbers such as -5 or +1.50 are left untouched.
    if(/^[=+\-@\t\r]/.test(v) && !/^[+-]?\d[\d.,]*$/.test(v)) v="'"+v;
    // Quote every field containing a comma, quote, CR, or LF; embedded
    // quotes are doubled according to the CSV format.
    if(/[",\r\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"';
    return v;
  };
  const header = columns.map(c=>esc(c.label)).join(',');
  const lines = rows.map(r=>columns.map(c=>esc(typeof c.value==='function'?c.value(r):r[c.value])).join(','));
  return '\uFEFF' + [header, ...lines].join('\r\n');
}

/* ---------- Form field builders ---------- */
function fieldHtml(id, label, innerHtml, errorMsg, hint, required){
  const describedBy = [];
  if(hint) describedBy.push(`${id}-hint`);
  if(errorMsg) describedBy.push(`${id}-error`);
  let controlHtml = innerHtml;
  const controlAttrs = [
    required ? ' aria-required="true"' : '',
    errorMsg ? ' aria-invalid="true"' : '',
    describedBy.length ? ` aria-describedby="${describedBy.join(' ')}"` : ''
  ].join('');
  controlHtml = controlHtml.replace(/<(input|select|textarea)(\s)/i, '<$1' + controlAttrs + '$2');
  return `<div class="field ${errorMsg?'error':''}">
    <label for="${id}">${escapeHtml(label)}${required ? ' <span aria-hidden="true">*</span>' : ''}</label>
    ${controlHtml}
    ${hint?`<div class="hint" id="${id}-hint">${escapeHtml(hint)}</div>`:''}
    ${errorMsg?`<div class="field-error" id="${id}-error" role="alert">${escapeHtml(errorMsg)}</div>`:''}
  </div>`;
}
function textField(o){
  const type = o.type||'text';
  const step = type==='number' ? (o.step||'0.01') : null;
  return fieldHtml(o.id, o.label,
    `<input type="${type}" id="${o.id}" name="${o.id}" value="${escapeHtml(o.value!==undefined?o.value:'')}"
      placeholder="${escapeHtml(o.placeholder||'')}" ${step?`step="${step}"`:''} ${o.min!==undefined?`min="${o.min}"`:''}
      ${o.maxlength?`maxlength="${o.maxlength}"`:''} ${o.required?'required':''} ${o.readonly?'readonly':''}>`, o.error, o.hint, !!o.required);
}
function selectField(o){
  const opts = (o.options||[]).map(opt=>{
    const val = Array.isArray(opt)?opt[0]:opt.value;
    const lab = Array.isArray(opt)?opt[1]:opt.label;
    return `<option value="${escapeHtml(val)}" ${String(val)===String(o.value)?'selected':''}>${escapeHtml(lab)}</option>`;
  }).join('');
  return fieldHtml(o.id, o.label,
    `<select id="${o.id}" name="${o.id}" ${o.required?'required':''}>
      ${o.placeholder?`<option value="">${escapeHtml(o.placeholder)}</option>`:''}${opts}
    </select>`, o.error, o.hint, !!o.required);
}
function textareaField(o){
  return fieldHtml(o.id, o.label,
    `<textarea id="${o.id}" name="${o.id}" placeholder="${escapeHtml(o.placeholder||'')}" ${o.maxlength?`maxlength="${o.maxlength}"`:''} ${o.required?'required':''}>${escapeHtml(o.value||'')}</textarea>`, o.error, o.hint, !!o.required);
}
function formErrorsBanner(errors){
  if(!errors || !errors.length) return '';
  return `<div class="form-errors"><strong>${escapeHtml(t('common.pleaseFixFollowing'))}</strong><ul>${errors.map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul></div>`;
}
function formData(form){
  const out = {};
  new FormData(form).forEach((v,k)=>{ out[k]=v; });
  return out;
}
function emptyState(emoji, title, text, actionHtml){
  return `<div class="empty-state"><div class="emoji">${emoji}</div><h4>${escapeHtml(title)}</h4><p>${escapeHtml(text)}</p>${actionHtml||''}</div>`;
}
function emptyActionButtons(actions){

function uxButtonLock(btn){

/* ============================================================
   3. UTILITIES — date-only arithmetic (local time, no UTC shifts)
   ============================================================ */
function addDaysISO(iso, n){
  const d = parseDateOnlyLocal(iso);
  if(!d) return '';
  return localDateISO(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n));
}
function daysBetweenISO(a, b){
  return Math.round((calendarDayNumber(b) - calendarDayNumber(a)) / 86400000);
}
function daysInMonth(y, m0){ return new Date(y, m0 + 1, 0).getDate(); }
/* Month-end rule: the anchor day is kept when the target month has it,
   otherwise the LAST day of that month is used (Jan 31 -> Feb 28/29 -> Mar 31;
   Feb 29 annual -> Feb 28 in common years, Feb 29 in leap years). */
function addMonthsClampedISO(anchorISO, n){
  const a = parseDateOnlyLocal(anchorISO);
  if(!a) return '';
  const first = new Date(a.getFullYear(), a.getMonth() + n, 1);
  const day = Math.min(a.getDate(), daysInMonth(first.getFullYear(), first.getMonth()));
  return localDateISO(new Date(first.getFullYear(), first.getMonth(), day));
}
function monthStartISO(mk){ return mk + '-01'; }
function monthEndISO(mk){ const [y,m] = mk.split('-').map(Number); return mk + '-' + String(daysInMonth(y, m-1)).padStart(2,'0'); }
function yearRange(y){ return { start: y + '-01-01', end: y + '-12-31' }; }
function minISO(a, b){ return a < b ? a : b; }
function maxISO(a, b){ return a > b ? a : b; }
function isValidISODate(v){
  if(!isValidDate(v)) return false;
  const y = Number(String(v).slice(0,4));
  return y >= 1900 && y <= 2200;
}
function monthShortName(m0){
  return new Date(2000, m0, 1).toLocaleDateString(currentLangLocale(), { month:'short' });
}
function weekdayShortName(dow){
  return new Date(2023, 0, 1 + dow).toLocaleDateString(currentLangLocale(), { weekday:'short' }); // 2023-01-01 is a Sunday
}
function fmtDateLong(iso){
  const d = parseDateOnlyLocal(iso);
  if(!d) return '—';
  return d.toLocaleDateString(currentLangLocale(), { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

/* ---------- Derived-data cache (always invalidated after a mutation / render) ---------- */
const DERIVED = { payIndex:null, occ:new Map(), focus:new Map(), earliest:null };
function invalidateDerived(){
  DERIVED.payIndex = null;
  DERIVED.occ = new Map();
  DERIVED.focus = new Map();

function paymentIndex(){
  if(DERIVED.payIndex) return DERIVED.payIndex;
  const idx = new Map();
  getPayments().forEach(p=>{
    if(!idx.has(p.billId)) idx.set(p.billId, new Map());
    const byDate = idx.get(p.billId);

  idx.forEach(byDate=>byDate.forEach(list=>list.sort((a,b)=>String(a.paymentDate).localeCompare(String(b.paymentDate)) || String(a.createdAt).localeCompare(String(b.createdAt)))));

}
function earliestDataDate(){
  if(DERIVED.earliest) return DERIVED.earliest;
  let e = todayISO();
  getBills().forEach(b=>{ if(isValidISODate(b.dueDate) && b.dueDate < e) e = b.dueDate; });
  getPayments().forEach(p=>{ if(isValidISODate(p.occurrenceDate) && p.occurrenceDate < e) e = p.occurrenceDate; if(isValidISODate(p.paymentDate) && p.paymentDate < e) e = p.paymentDate; });

/* ============================================================
   7. OCCURRENCE ENGINE
   A recurring bill is a RULE; each due date is an independent
   occurrence identified by billId + occurrenceDate. Only the
   requested date window is generated (never infinite).
   ============================================================ */
function billScheduleEnd(bill){
  let stop = '9999-12-31';
  if(bill.archived && bill.archivedAt && isValidISODate(bill.archivedAt)) stop = minISO(stop, bill.archivedAt);
  return stop;
}
function scheduleDates(bill, fromISO, toISO){
  const anchor = bill && bill.dueDate;
  if(!isValidISODate(anchor) || !fromISO || !toISO) return [];
  const stop = minISO(toISO, billScheduleEnd(bill));
  const from = maxISO(fromISO, anchor);
  if(from > stop) return [];
  const f = BILL_FREQUENCIES[bill.frequency];
  const out = [];
  if(!f || bill.frequency === 'once'){
    if(anchor >= from && anchor <= stop) out.push(anchor);
    return out;
  }
  let guard = 0;
  if(f.days){
    let n = Math.max(0, Math.floor(daysBetweenISO(anchor, from) / f.days) - 1);
    while(guard++ < 5000){
      const d = addDaysISO(anchor, n * f.days);
      if(d > stop) break;
      if(d >= from) out.push(d);
      n++;
    }
  } else {
    const a = parseDateOnlyLocal(anchor), fr = parseDateOnlyLocal(from);
    const monthsDiff = (fr.getFullYear() - a.getFullYear()) * 12 + (fr.getMonth() - a.getMonth());
    let n = Math.max(0, Math.floor(monthsDiff / f.months) - 1);
    while(guard++ < 5000){
      const d = addMonthsClampedISO(anchor, n * f.months);
      if(d > stop) break;
      if(d >= from) out.push(d);
      n++;
    }
  }
  return out;
}
function isScheduledDate(bill, iso){ return scheduleDates(bill, iso, iso).length > 0; }
function getExpectedAmount(bill, iso){
  if(bill.billType === 'variable' && bill.overrides && Object.prototype.hasOwnProperty.call(bill.overrides, iso)){
    return round2(safeNum(bill.overrides[iso], 0));
  }
  return round2(safeNum(bill.amount, 0));
}
function getPaymentsForOccurrence(billId, iso){
  const byDate = paymentIndex().get(billId);
  return (byDate && byDate.get(iso)) ? byDate.get(iso) : [];
}

/* ============================================================
   8. STATUS ENGINE — the ONLY place occurrence status is decided
   ============================================================ */
function getOccurrenceStatus(occ, today){
  today = today || todayISO();
  if(occ.expected <= 0 || occ.paid >= occ.expected) return 'paid';
  if(occ.paid > 0) return 'partial';
  if(occ.date < today) return 'overdue';
  if(occ.date === today) return 'dueToday';
  return 'upcoming';
}

/* ============================================================
   9. PAYMENT ENGINE
   ============================================================ */
function calculateRemaining(expected, paid){ return round2(Math.max(0, safeNum(expected) - safeNum(paid))); }
function calculateOverpayment(expected, paid){ return round2(Math.max(0, safeNum(paid) - safeNum(expected))); }
function calculatePaymentProgress(expected, paidApplied){
  expected = safeNum(expected); paidApplied = safeNum(paidApplied);
  if(expected <= 0) return 0;
  return clamp(round2(paidApplied / expected * 100), 0, 100);
}
function getPaidAmount(occ){ return round2(sum(occ.payments || getPaymentsForOccurrence(occ.billId, occ.date), p=>safeNum(p.amount))); }
function getRemainingAmount(occ){ return calculateRemaining(occ.expected, getPaidAmount(occ)); }

function buildOccurrence(bill, iso, offSchedule){
  const today = todayISO();
  const payments = getPaymentsForOccurrence(bill.id, iso);
  const expected = getExpectedAmount(bill, iso);
  const occ = { key: bill.id + '|' + iso, billId: bill.id, bill, date: iso, expected, payments, offSchedule: !!offSchedule };
  occ.paid = getPaidAmount(occ);
  occ.remaining = calculateRemaining(expected, occ.paid);
  occ.overpaid = calculateOverpayment(expected, occ.paid);
  occ.applied = round2(Math.min(occ.paid, expected));
  let running = 0; occ.paidOnDate = '';
  for(const p of payments){ running = round2(running + safeNum(p.amount)); if(running >= expected && expected > 0){ occ.paidOnDate = p.paymentDate; break; } }
  occ.status = getOccurrenceStatus(occ, today);
  occ.paidLate = occ.status === 'paid' && !!occ.paidOnDate && occ.paidOnDate > iso;
  occ.pastDue = iso < today && occ.remaining > 0;
  occ.daysLate = occ.status === 'overdue' || occ.pastDue ? daysBetweenISO(iso, today) : 0;
  return occ;
}
function getBillOccurrences(bill, fromISO, toISO){
  if(!bill || !fromISO || !toISO || fromISO > toISO) return [];
  const key = bill.id + '|' + fromISO + '|' + toISO;
  if(DERIVED.occ.has(key)) return DERIVED.occ.get(key);
  const dates = new Set(scheduleDates(bill, fromISO, toISO));
  const scheduled = new Set(dates);
  const byDate = paymentIndex().get(bill.id);
  if(byDate) byDate.forEach((list, d)=>{ if(d >= fromISO && d <= toISO && list.length) dates.add(d); });
  const out = Array.from(dates).sort().map(d=>buildOccurrence(bill, d, !scheduled.has(d)));
  DERIVED.occ.set(key, out);
  return out;
}
function getOccurrence(billId, iso){
  const bill = getBill(billId);
  if(!bill || !isValidISODate(iso)) return null;
  const list = getBillOccurrences(bill, iso, iso);
  return list[0] || null;
}
function occurrenceWindow(range){
  if(!range) return null;
  const start = maxISO(range.start, earliestDataDate());
  const end = minISO(range.end, (new Date().getFullYear() + 2) + '-12-31');
  return start <= end ? { start, end } : null;
}
function billMatchesScope(bill, scope){
  scope = scope || {};
  if(scope.category && bill.categoryId !== scope.category) return false;
  if(scope.bill && bill.id !== scope.bill) return false;
  if(scope.activeOnly && bill.archived) return false;
  return true;
}
function getAllOccurrences(range, scope){
  const w = occurrenceWindow(range);
  if(!w) return [];
  const out = [];
  getBills().forEach(b=>{ if(billMatchesScope(b, scope)) getBillOccurrences(b, w.start, w.end).forEach(o=>out.push(o)); });
  return out.sort((a,b)=>a.date.localeCompare(b.date) || a.bill.name.localeCompare(b.bill.name));
}
/* The occurrence a bill row represents: the oldest unpaid due date up to today,
   otherwise the next unpaid due date, otherwise the most recent one. */
function getBillFocus(bill){
  if(DERIVED.focus.has(bill.id)) return DERIVED.focus.get(bill.id);
  const today = todayISO();
  const past = getBillOccurrences(bill, maxISO(bill.dueDate || today, addDaysISO(today, -1095)), today);
  const outstanding = past.filter(o=>o.status !== 'paid');
  let occ = null;
  if(outstanding.length) occ = outstanding[0];
  else {
    const future = getBillOccurrences(bill, addDaysISO(today, 1), addDaysISO(today, 800));
    occ = future.find(o=>o.status !== 'paid') || future[0] || past[past.length-1] || null;
  }
  const res = { occ, outstandingCount: outstanding.length, overdueCount: outstanding.filter(o=>o.status==='overdue').length };
  DERIVED.focus.set(bill.id, res);
  return res;
}
function billStatusKey(bill){
  if(bill.archived) return 'archived';
  const f = getBillFocus(bill);
  return f.occ ? f.occ.status : 'paid';
}

/* ============================================================
   10. CALCULATION ENGINE — every figure on every page comes from here
   ============================================================ */
function totalsOf(occs){
  const r = { count: occs.length, expected:0, paid:0, applied:0, remaining:0, overpaid:0 };
  occs.forEach(o=>{ r.expected += o.expected; r.paid += o.paid; r.applied += o.applied; r.remaining += o.remaining; r.overpaid += o.overpaid; });
  ['expected','paid','applied','remaining','overpaid'].forEach(k=>r[k] = round2(r[k]));
  r.progress = calculatePaymentProgress(r.expected, r.applied);
  return r;
}
function paymentsInRange(range, scope){
  return getPayments().filter(p=>{
    if(range && !inRange(p.paymentDate, range.start, range.end)) return false;
    const bill = getBill(p.billId);
    if(!bill) return false;
    return billMatchesScope(bill, scope);
  });
}
function getOverdueTotals(scope){
  const occs = getAllOccurrences({ start:'1900-01-01', end: addDaysISO(todayISO(), -1) }, scope).filter(o=>o.status==='overdue');
  return Object.assign(totalsOf(occs), { items: occs });
}
function getDueSoonTotals(days, scope){
  const today = todayISO();
  const occs = getAllOccurrences({ start: today, end: addDaysISO(today, Math.max(0, days)) }, scope).filter(o=>o.status!=='paid');
  return Object.assign(totalsOf(occs), { items: occs });
}
function dueSoonDays(){ return clamp(Math.floor(safeNum(STORE.state.settings.dueSoonDays, 7)), 1, 60); }
function getStatusTotals(range, scope){
  const occs = getAllOccurrences(range, scope);
  const out = {};
  OCC_STATUSES.forEach(s=>{ out[s] = totalsOf(occs.filter(o=>o.status===s)); });
  return out;
}
function getDashboardMetrics(range){
  const occs = getAllOccurrences(range);
  const tot = totalsOf(occs);
  const bills = getBills();
  return {
    range, occurrences: occs,
    totalDue: tot.expected, totalPaid: tot.paid, applied: tot.applied, remaining: tot.remaining, overpaid: tot.overpaid,
    progress: tot.progress,
    paidCount: occs.filter(o=>o.status==='paid').length,
    pendingCount: occs.filter(o=>o.status!=='paid').length,
    overdue: getOverdueTotals(),
    dueSoon: getDueSoonTotals(dueSoonDays()),
    totalBills: bills.length,
    activeBills: bills.filter(b=>!b.archived).length
  };
}
function getMonthlyTotals(year, scope){
  const months = [];
  for(let m=0; m<12; m++){
    const mk = year + '-' + String(m+1).padStart(2,'0');
    const r = { start: monthStartISO(mk), end: monthEndISO(mk) };
    const occs = getAllOccurrences(r, scope);
    const tot = totalsOf(occs);
    const cash = round2(sum(paymentsInRange(r, scope), p=>safeNum(p.amount)));
    const counts = {}; OCC_STATUSES.forEach(s=>counts[s] = occs.filter(o=>o.status===s).length);
    months.push(Object.assign(tot, { month:m, monthKey:mk, cashPaid:cash, counts }));
  }
  return months;
}
function getYearlyTotals(year, scope){
  const months = getMonthlyTotals(year, scope);
  const r = { year, expected:0, paid:0, applied:0, remaining:0, overpaid:0, cashPaid:0, count:0, counts:{} };
  OCC_STATUSES.forEach(s=>r.counts[s]=0);
  months.forEach(m=>{ ['expected','paid','applied','remaining','overpaid','cashPaid','count'].forEach(k=>r[k]+=m[k]); OCC_STATUSES.forEach(s=>r.counts[s]+=m.counts[s]); });
  ['expected','paid','applied','remaining','overpaid','cashPaid'].forEach(k=>r[k]=round2(r[k]));
  r.progress = calculatePaymentProgress(r.expected, r.applied);
  r.months = months;
  return r;
}
function getCategoryTotals(range, scope){
  const map = new Map();
  const row = id=>{ if(!map.has(id)) map.set(id, { categoryId:id, label: categoryName(id), expected:0, paid:0, remaining:0, spent:0, count:0 }); return map.get(id); };
  getAllOccurrences(range, scope).forEach(o=>{ const r = row(o.bill.categoryId); r.expected += o.expected; r.paid += o.paid; r.remaining += o.remaining; r.count++; });
  paymentsInRange(range, scope).forEach(p=>{ const b = getBill(p.billId); row(b.categoryId).spent += safeNum(p.amount); });
  return Array.from(map.values()).map(r=>{ ['expected','paid','remaining','spent'].forEach(k=>r[k]=round2(r[k])); return r; })
    .sort((a,b)=>b.spent - a.spent || b.expected - a.expected);
}
function getPaymentMethodTotals(range, scope){
  const map = new Map();
  paymentsInRange(range, scope).forEach(p=>{
    if(!map.has(p.paymentMethodId)) map.set(p.paymentMethodId, { methodId:p.paymentMethodId, label: methodName(p.paymentMethodId), total:0, count:0 });
    const r = map.get(p.paymentMethodId); r.total += safeNum(p.amount); r.count++;
  });
  return Array.from(map.values()).map(r=>{ r.total = round2(r.total); return r; }).sort((a,b)=>b.total - a.total);
}
function getPaymentMetrics(range, scope, list){
  const pays = list || paymentsInRange(range, scope);
  const mk = currentMonthKey();
  const thisMonth = { start: monthStartISO(mk), end: monthEndISO(mk) };
  const occKeys = new Map();
  pays.forEach(p=>{ const k = p.billId + '|' + p.occurrenceDate; if(!occKeys.has(k)) occKeys.set(k, getOccurrence(p.billId, p.occurrenceDate)); });
  const occs = Array.from(occKeys.values()).filter(Boolean);
  return {
    count: pays.length,
    total: round2(sum(pays, p=>safeNum(p.amount))),
    thisMonth: round2(sum(pays.filter(p=>inRange(p.paymentDate, thisMonth.start, thisMonth.end)), p=>safeNum(p.amount))),
    partialCount: pays.filter(p=>{ const o = occKeys.get(p.billId + '|' + p.occurrenceDate); return o && o.status==='partial'; }).length,
    overpaidTotal: round2(sum(occs, o=>o.overpaid)),
    overpaidCount: occs.filter(o=>o.overpaid > 0).length
  };
}

/* ============================================================
   11. FILTERING ENGINE — reusable, combinable filter predicates
   ============================================================ */
function normalizeSearch(s){ return String(s||'').toLocaleLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
function textMatches(query, fields){
  const q = normalizeSearch(query);
  if(!q) return true;
  const hay = normalizeSearch(fields.filter(Boolean).join(' • '));
  return q.split(/\s+/).every(term=>hay.indexOf(term) !== -1);
}
function isEmptyFilterValue(v){ return v === undefined || v === null || v === '' || v === 'all'; }
function runFilters(items, spec, values){
  const active = Object.keys(spec).filter(k=>!isEmptyFilterValue(values[k]));
  if(!active.length) return items.slice();
  return items.filter(item=>active.every(k=>spec[k](item, values[k])));
}
function rangeFromState(st){
  if(!st.range || st.range === 'all') return null;
  if(st.range === 'custom' && validateCustomDateRange(st.customStart, st.customEnd).length) return null;
  return resolveDateRange(st.range, st.customStart, st.customEnd);
}
const BILL_FILTER_SPEC = {
  q: (bill, q)=>textMatches(q, [bill.name, categoryName(bill.categoryId), bill.notes, bill.paymentMethodId ? methodName(bill.paymentMethodId) : '']),
  tab: (bill, tab)=> tab === 'archived' ? !!bill.archived : (!bill.archived && billStatusKey(bill) === tab),
  category: (bill, v)=>bill.categoryId === v,
  frequency: (bill, v)=>bill.frequency === v,
  type: (bill, v)=>bill.billType === v,
  method: (bill, v)=>bill.paymentMethodId === v,
  range: (bill, r)=>getBillOccurrences(bill, r.start, minISO(r.end, (new Date().getFullYear()+2)+'-12-31')).length > 0
};
const PAYMENT_FILTER_SPEC = {
  q: (p, q)=>{ const b = getBill(p.billId); return textMatches(q, [b && b.name, b && categoryName(b.categoryId), methodName(p.paymentMethodId), p.notes]); },
  range: (p, r)=>inRange(p.paymentDate, r.start, r.end),
  bill: (p, v)=>p.billId === v,
  category: (p, v)=>{ const b = getBill(p.billId); return !!b && b.categoryId === v; },
  method: (p, v)=>p.paymentMethodId === v,
  min: (p, v)=>safeNum(p.amount) >= safeNum(v),
  max: (p, v)=>safeNum(p.amount) <= safeNum(v)
};

/* ============================================================
   12. CHARTS — dependency-free SVG chart engine.
   Renderers receive ALREADY-CALCULATED data from the calculation
   engine; they never compute financial values themselves.
   Charts are drawn at the container's real pixel width and are
   redrawn on resize so text stays legible on every screen.
   ============================================================ */
const CHART_SPECS = new Map();
let CHART_SEQ = 0;
function chartSlot(spec){
  const id = 'chart-' + (++CHART_SEQ);
  CHART_SPECS.set(id, spec);
  return `<div class="chart-slot" data-chart-id="${id}"></div>`;
}
function drawCharts(root){
  (root || document).querySelectorAll('.chart-slot[data-chart-id]').forEach(slot=>{
    const spec = CHART_SPECS.get(slot.getAttribute('data-chart-id'));
    if(!spec) return;
    const width = Math.max(240, Math.floor(slot.clientWidth || 320));
    try{
      const fn = { donut: renderDonutChart, bar: renderBarChart, line: renderLineChart, progress: renderProgressChart, hbar: renderHorizontalBarChart }[spec.type];
      slot.innerHTML = fn ? fn(spec, width) : '';
    }catch(e){
      console.error('Chart render failed', e);
      slot.innerHTML = `<p class="hint">${escapeHtml(t('chart.renderError'))}</p>`;
    }
  });
}
function resetChartRegistry(){ CHART_SPECS.clear(); }
function chartEmpty(msg){
  return `<div class="chart-empty"><div class="chart-empty-ic" aria-hidden="true">&#9711;</div><p>${escapeHtml(msg || t('chart.noData'))}</p></div>`;
}
function chartLegend(items){
  return `<ul class="chart-legend">${items.map(it=>`<li><span class="chart-swatch" style="background:${it.color}" aria-hidden="true"></span><span class="chart-legend-label">${escapeHtml(it.label)}</span>${it.value!==undefined?`<strong>${it.value}</strong>`:''}</li>`).join('')}</ul>`;
}
function niceMax(v){
  if(v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return step * p;
}
/* Pick 4 or 5 gridlines so every tick is a round number (e.g. 0, 1k, 2k … 5k). */
function niceTickCount(top){
  for(const n of [4,5,2]){ const step = top/n; const p = Math.pow(10, Math.floor(Math.log10(step))); const m = Math.round(step/p*100)/100; if([1,2,2.5,5].indexOf(m) !== -1) return n; }
  return 4;
}
function svgText(x, y, text, attrs){ return `<text x="${x}" y="${y}" ${attrs||''}>${text}</text>`; }

/* Donut: spec = { segments:[{label,value,color,display}], centerValue, centerLabel, title, emptyText } */
function renderDonutChart(spec, width){
  const segs = (spec.segments||[]).filter(s=>s.value > 0);
  const total = sum(segs, s=>s.value);
  if(!segs.length || total <= 0) return chartEmpty(spec.emptyText);
  const size = Math.min(220, Math.max(160, Math.floor(width * 0.42)));
  const r = size/2 - 12, cx = size/2, cy = size/2, sw = Math.max(18, Math.round(size*0.13));
  const circ = 2 * Math.PI * r;
  let offset = 0;
  const arcs = segs.map(s=>{
    const len = s.value / total * circ;
    const pct = fmtPct(s.value / total * 100, 1);
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"><title>${escapeHtml(s.label)}: ${s.display || fmtMoney(s.value)} (${pct})</title></circle>`;
    offset += len;
    return el;
  }).join('');
  const aria = (spec.title ? spec.title + ': ' : '') + segs.map(s=>`${s.label} ${stripTags(s.display || fmtMoney(s.value))}`).join(', ');
  const svg = `<svg class="chart-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${escapeHtml(aria)}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#EEEBE2" stroke-width="${sw}"></circle>${arcs}
    ${spec.centerValue ? svgText(cx, cy + 2, spec.centerValue, 'text-anchor="middle" class="donut-value"') : ''}
    ${spec.centerLabel ? svgText(cx, cy + 20, escapeHtml(spec.centerLabel), 'text-anchor="middle" class="donut-label"') : ''}
  </svg>`;
  const legend = chartLegend(segs.map(s=>({ color:s.color, label:s.label + ' · ' + fmtPct(s.value/total*100, 0), value: s.display || fmtMoney(s.value) })));
  return `<div class="donut-wrap">${svg}${legend}</div>`;
}
function stripTags(s){ const d = document.createElement('div'); d.innerHTML = s; return d.textContent || ''; }

/* Grouped vertical bars: spec = { labels:[...], series:[{name,color,values:[]}], title, emptyText, format } */
function renderBarChart(spec, width){
  const series = spec.series || [];
  const labels = spec.labels || [];
  const maxV = Math.max(0, ...series.map(s=>Math.max(0, ...s.values)));
  if(!labels.length || maxV <= 0) return chartEmpty(spec.emptyText);
  const fmt = spec.format || fmtMoney;
  const fmtAxis = spec.formatAxis || (v=>escapeHtml(formatMoneyCompactText(v)));
  const H = 250, padL = width < 420 ? 48 : 62, padR = 10, padT = 14, padB = 30;
  const plotW = width - padL - padR, plotH = H - padT - padB;
  const top = niceMax(maxV);
  const ticks = niceTickCount(top);
  let grid = '';
  for(let i=0;i<=ticks;i++){
    const v = top * i / ticks, y = padT + plotH - (v/top)*plotH;
    grid += `<line x1="${padL}" x2="${width-padR}" y1="${y}" y2="${y}" class="chart-grid"/>` + svgText(padL - 6, y + 4, fmtAxis(v), 'text-anchor="end" class="chart-axis"');
  }
  const groupW = plotW / labels.length;
  const barGap = 2, inner = groupW * 0.72;
  const barW = Math.max(3, (inner - barGap*(series.length-1)) / series.length);
  let bars = '', xl = '';
  const every = groupW < 26 ? 2 : 1;
  labels.forEach((lab, i)=>{
    const gx = padL + i*groupW + (groupW - inner)/2;
    series.forEach((s, si)=>{
      const v = Math.max(0, s.values[i] || 0);
      const h = (v/top)*plotH;
      const x = gx + si*(barW+barGap), y = padT + plotH - h;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="2" fill="${s.color}"><title>${escapeHtml(lab)} — ${escapeHtml(s.name)}: ${stripTags(fmt(v))}</title></rect>`;
    });
    if(i % every === 0) xl += svgText((padL + i*groupW + groupW/2).toFixed(1), H - 10, escapeHtml(lab), 'text-anchor="middle" class="chart-axis"');
  });
  const aria = (spec.title||'') + '. ' + series.map(s=>s.name + ': ' + labels.map((l,i)=>l + ' ' + stripTags(fmt(s.values[i]||0))).join(', ')).join('. ');
  const svg = `<svg class="chart-svg" width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" role="img" aria-label="${escapeHtml(aria)}">${grid}${bars}${xl}</svg>`;
  const legend = chartLegend(series.map(s=>({ color:s.color, label:s.name, value: fmt(sum(s.values)) })));
  return svg + legend;
}

/* Line/area: spec = { labels, series:[{name,color,values}], title, emptyText, format } */
function renderLineChart(spec, width){
  const series = spec.series || [];
  const labels = spec.labels || [];
  const maxV = Math.max(0, ...series.map(s=>Math.max(0, ...s.values)));
  if(!labels.length || maxV <= 0) return chartEmpty(spec.emptyText);
  const fmt = spec.format || fmtMoney;
  const H = 240, padL = width < 420 ? 48 : 62, padR = 16, padT = 16, padB = 30;
  const plotW = width - padL - padR, plotH = H - padT - padB;
  const top = niceMax(maxV);
  let grid = '';
  const lt = niceTickCount(top);
  for(let i=0;i<=lt;i++){
    const v = top*i/lt, y = padT + plotH - (v/top)*plotH;
    grid += `<line x1="${padL}" x2="${width-padR}" y1="${y}" y2="${y}" class="chart-grid"/>` + svgText(padL-6, y+4, escapeHtml(formatMoneyCompactText(v)), 'text-anchor="end" class="chart-axis"');
  }
  const step = labels.length > 1 ? plotW/(labels.length-1) : 0;
  const px = i=>padL + i*step, py = v=>padT + plotH - (Math.max(0,v)/top)*plotH;
  let paths = '';
  series.forEach(s=>{
    const pts = s.values.map((v,i)=>`${px(i).toFixed(1)},${py(v).toFixed(1)}`);
    paths += `<path d="M${pts.join(' L')} L${px(labels.length-1).toFixed(1)},${padT+plotH} L${padL},${padT+plotH} Z" fill="${s.color}" opacity=".08"/>`;
    paths += `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v,i)=>{ paths += `<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="4" fill="#fff" stroke="${s.color}" stroke-width="2"><title>${escapeHtml(labels[i])} — ${escapeHtml(s.name)}: ${stripTags(fmt(v))}</title></circle>`; });
  });
  const every = step < 30 ? 2 : 1;
  const xl = labels.map((l,i)=> i % every === 0 ? svgText(px(i).toFixed(1), H-10, escapeHtml(l), 'text-anchor="middle" class="chart-axis"') : '').join('');
  const aria = (spec.title||'') + '. ' + series.map(s=>s.name + ': ' + labels.map((l,i)=>l+' '+stripTags(fmt(s.values[i]||0))).join(', ')).join('. ');
  const svg = `<svg class="chart-svg" width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" role="img" aria-label="${escapeHtml(aria)}">${grid}${paths}${xl}</svg>`;
  return svg + chartLegend(series.map(s=>({ color:s.color, label:s.name, value: fmt(sum(s.values)) })));
}

/* Progress: spec = { value (0-100), paidDisplay, remainingDisplay, label } */
function renderProgressChart(spec){
  const v = clamp(safeNum(spec.value), 0, 100);
  return `<div class="progress-chart">
    <div class="progress-chart-head"><span>${escapeHtml(spec.label || '')}</span><strong>${fmtPct(v, 0)}</strong></div>
    <div class="progress-track big" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(v)}" aria-label="${escapeHtml(spec.label || '')}"><div class="progress-fill" style="width:${v}%"></div></div>
    <div class="progress-chart-foot"><span><span class="chart-swatch" style="background:var(--magenta)" aria-hidden="true"></span>${escapeHtml(t('common.paid'))}: ${spec.paidDisplay}</span><span><span class="chart-swatch" style="background:#EEEBE2" aria-hidden="true"></span>${escapeHtml(t('common.remaining'))}: ${spec.remainingDisplay}</span></div>
  </div>`;
}

/* Horizontal bars (HTML/CSS, fully responsive): spec = { rows:[{label,value,color,display,sub}], emptyText } */
function renderHorizontalBarChart(spec){
  const rows = (spec.rows||[]).filter(r=>r.value > 0);
  if(!rows.length) return chartEmpty(spec.emptyText);
  const max = Math.max(...rows.map(r=>r.value));
  return `<ul class="hbar-list" aria-label="${escapeHtml(spec.title||'')}">${rows.map((r,i)=>`
    <li><div class="hbar-head"><span class="hbar-label">${escapeHtml(r.label)}</span><strong>${r.display || fmtMoney(r.value)}</strong></div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(2, r.value/max*100).toFixed(1)}%;background:${r.color || CHART_COLORS[i % CHART_COLORS.length]}"></div></div>
    ${r.sub ? `<div class="hint" style="margin-top:2px;">${escapeHtml(r.sub)}</div>` : ''}</li>`).join('')}</ul>`;
}

/* ============================================================
   13. COMPONENTS — small reusable HTML builders
   ============================================================ */
function statusBadge(status, opts){
  opts = opts || {};

/* ---------- Undo support for destructive actions ---------- */
function snapshotState(){ return JSON.stringify(STORE.state); }
function restoreSnapshot(snapshot){
  let prev = null;
  try{ prev = JSON.parse(snapshot); }catch(e){ return; }
  const ok = STORE.mutate(s=>{ Object.keys(s).forEach(k=>delete s[k]); Object.assign(s, prev); });
  if(ok) toast(t('common.toastRestored'), 'success');
}
/* Mutation wrapper: STORE.mutate validates-by-construction, saves, invalidates
   derived data and re-renders every view; this adds consistent feedback. */
function saveAndRefresh(fn, successMsg, opts){
  opts = opts || {};
  const snap = opts.undo ? snapshotState() : null;
  const ok = STORE.mutate(fn);
  if(ok && successMsg){
    toast(successMsg, 'success', snap ? { actionLabel: t('common.undo'), onAction: ()=>restoreSnapshot(snap), duration: 7000 } : undefined);
  }
  return ok;
}

function parseAmountInput(v){
  const s = String(v === undefined || v === null ? '' : v).trim().replace(',', '.');
  if(s === '' || !/^-?\d*(\.\d+)?$/.test(s)) return NaN;
  return Number(s);
}
function validateBillInput(d){
  const errors = {};
  const name = String(d.name||'').trim();
  if(!name) errors.name = t('val.nameRequired');
  else if(name.length > MAX_NAME_LEN) errors.name = t('val.nameTooLong', { n: MAX_NAME_LEN });
  const cat = getCategory(d.categoryId);
  if(!d.categoryId) errors.categoryId = t('val.categoryRequired');
  else if(!cat) errors.categoryId = t('val.categoryInvalid');
  if(BILL_TYPES.indexOf(d.billType) === -1) errors.billType = t('val.typeInvalid');
  const amt = parseAmountInput(d.amount);
  if(!Number.isFinite(amt) || amt < 0) errors.amount = t('val.amountInvalid');
  else if(amt > MAX_AMOUNT) errors.amount = t('val.amountTooLarge');
  else if(d.billType === 'fixed' && round2(amt) <= 0) errors.amount = t('val.fixedAmountPositive');
  if(!d.frequency) errors.frequency = t('val.frequencyRequired');
  else if(!BILL_FREQUENCIES[d.frequency]) errors.frequency = t('val.frequencyInvalid');
  if(!isValidISODate(d.dueDate)) errors.dueDate = t('val.dateInvalid');
  if(d.paymentMethodId && !getMethod(d.paymentMethodId)) errors.paymentMethodId = t('val.methodInvalid');
  if(String(d.notes||'').length > MAX_NOTES_LEN) errors.notes = t('val.notesTooLong', { n: MAX_NOTES_LEN });
  return { errors, amount: round2(amt), name };
}
function saveBill(d, id){
  const v = validateBillInput(d);
  if(Object.keys(v.errors).length) return { ok:false, errors:v.errors };
  const existing = id ? getBill(id) : null;
  const archived = d.status === 'archived';
  const rec = {
    name: v.name, categoryId: d.categoryId, billType: d.billType, amount: v.amount,
    frequency: d.frequency, dueDate: d.dueDate,
    paymentMethodId: d.paymentMethodId || '', autoPay: !!d.autoPay, notes: String(d.notes||'').trim(),
    archived, active: !archived,
    archivedAt: archived ? ((existing && existing.archived && existing.archivedAt) ? existing.archivedAt : todayISO()) : ''
  };
  let newId = id;
  const ok = saveAndRefresh(s=>{
    if(existing){
      const b = s.bills.find(x=>x.id===id);
      Object.assign(b, rec, { updatedAt: nowISO() });
      if(b.billType !== 'variable') b.overrides = b.overrides || {};
    } else {
      newId = uid('bill');
      s.bills.push(Object.assign({ id:newId, overrides:{}, createdAt: nowISO(), updatedAt: nowISO() }, rec));
    }
  }, t(existing ? 'bills.toastUpdated' : 'bills.toastAdded'));
  return { ok, id:newId };
}
function orphanedPaymentCount(billId, d){
  const probe = Object.assign({}, getBill(billId), { dueDate:d.dueDate, frequency:d.frequency, archived: d.status==='archived', archivedAt: d.status==='archived' ? todayISO() : '' });
  return getPayments().filter(p=>p.billId===billId && !isScheduledDate(probe, p.occurrenceDate)).length;

function validatePaymentInput(d){

function occurrenceChoices(bill, includeDate){
  const today = todayISO();
  const from = maxISO(bill.dueDate, addDaysISO(today, -548));
  const occs = getBillOccurrences(bill, from, addDaysISO(today, 400));
  let list = occs.filter(o=>o.date >= addDaysISO(today, -120) || o.status !== 'paid');
  const future = list.filter(o=>o.date > today);
  list = list.filter(o=>o.date <= today).concat(future.slice(0, 18));
  if(includeDate && !list.some(o=>o.date === includeDate)){ const o = getOccurrence(bill.id, includeDate) || buildOccurrence(bill, includeDate, true); list.push(o); }
  return list.sort((a,b)=>a.date.localeCompare(b.date));
}

          ${textField({ id:'pay-amount', label:t('common.amount'), type:'number', step:'0.01', min:0, value:d.amount, required:true, error:errors.amount })}
        </div>
        ${selectField({ id:'pay-method', label:t('common.paymentMethod'), value:d.paymentMethodId, options:methodSelectOptions(d.paymentMethodId), placeholder:t('common.select'), required:true, error:errors.paymentMethodId })}
        ${textareaField({ id:'pay-notes', label:t('common.notes'), value:d.notes, maxlength:MAX_NOTES_LEN, error:errors.notes })}
      </form>`,
      footerHtml: `<button class="btn btn-outline" type="button" data-close-modal="1">${escapeHtml(t('common.cancel'))}</button><button class="btn btn-accent" type="button" id="pay-save-btn">${escapeHtml(t(payment ? 'common.saveChanges' : 'payments.record'))}</button>`,
      onMount(box){
        const billSel = box.querySelector('#pay-bill'), occSel = box.querySelector('#pay-occurrence'), amt = box.querySelector('#pay-amount');
        const updateOverHint = ()=>{
          const hint = box.querySelector('#pay-over-hint');
          const o = getOccurrence(billSel.value, occSel.value);
          if(!hint || !o) return;
          let paidExcl = o.paid;
          if(payment && payment.billId===o.billId && payment.occurrenceDate===o.date) paidExcl = round2(paidExcl - safeNum(payment.amount));
          const a = parseAmountInput(amt.value);
          const over = Number.isFinite(a) ? calculateOverpayment(o.expected, paidExcl + a) : 0;
          hint.textContent = over > 0 ? t('payments.overHint', { amount: formatMoneyText(over) }) : '';
        };
        const refreshSummary = ()=>{
          box.querySelector('#pay-summary').innerHTML = summaryHtml(billSel.value, occSel.value);
          const o = getOccurrence(billSel.value, occSel.value);
          if(o && !amountTouched) amt.value = String(o.remaining > 0 ? o.remaining : o.expected);
          updateOverHint();
        };
        billSel.addEventListener('change', ()=>{
          const b = getBill(billSel.value);
          d.billId = billSel.value;
          d.occurrenceDate = b ? defaultOccurrenceFor(b) : '';
          occSel.innerHTML = `<option value="">${escapeHtml(t('common.select'))}</option>` + occOptionsFor(d.billId, d.occurrenceDate).map(([v,l])=>`<option value="${escapeHtml(v)}" ${v===d.occurrenceDate?'selected':''}>${escapeHtml(l)}</option>`).join('');
          if(b && b.paymentMethodId && getMethod(b.paymentMethodId) && !getMethod(b.paymentMethodId).archived) box.querySelector('#pay-method').value = b.paymentMethodId;
          refreshSummary();
        });
        occSel.addEventListener('change', refreshSummary);
        amt.addEventListener('input', ()=>{ amountTouched = true; updateOverHint(); });
        updateOverHint();
        box.querySelector('#pay-form').addEventListener('submit', e=>{ e.preventDefault(); box.querySelector('#pay-save-btn').click(); });
        box.querySelector('#pay-save-btn').addEventListener('click', ()=>{
          d = { billId: billSel.value, occurrenceDate: occSel.value, paymentDate: box.querySelector('#pay-date').value, amount: amt.value, paymentMethodId: box.querySelector('#pay-method').value, notes: box.querySelector('#pay-notes').value };
          const v = validatePaymentInput(d);
          if(Object.keys(v.errors).length){ amountTouched = true; render(v.errors); firstErrorFocus(document.getElementById('modal-box'), v.errors, PAY_FIELD_IDS); return; }
          const res = savePayment(d, payment ? payment.id : null);
          if(res.ok){ closeModal(); if(opts.onDone) opts.onDone(d); }
        });
      }
    });
  };
  render({});
}

const STATUS_FILTERS = ['all','overdue','dueToday','partial','upcoming','paid'];
function statusFilterTabs(opts){
  // opts: { id, tabs:[key], active, counts:{key:n}, labelFor(key), ariaLabel, groupLabel, idPrefix }
  const icon = k => k === 'all' ? '&#8801;' : (STATUS_META[k] ? STATUS_META[k].icon : '');
  return `<div class="status-filter${opts.brand ? ' brand' : ''}">
    ${opts.groupLabel ? `<div class="status-filter-label" id="${opts.id}-label">${escapeHtml(opts.groupLabel)}</div>` : ''}
    <div class="status-tabs" id="${opts.id}" role="group" ${opts.groupLabel ? `aria-labelledby="${opts.id}-label"` : `aria-label="${escapeHtml(opts.ariaLabel || '')}"`}>
      ${opts.tabs.map(k=>{ const on = opts.active === k; const label = opts.labelFor(k); const n = opts.counts[k];
        return `<button type="button" class="status-tab st-${k}${on ? ' on' : ''}" id="${opts.idPrefix}${k}" data-status-tab="${k}" aria-pressed="${on}" aria-label="${escapeHtml(t('common.statusTabAria', { status: label, n }))}">
          <span class="st-ic" aria-hidden="true">${icon(k)}</span><span class="st-label">${escapeHtml(label)}</span><span class="st-count" aria-hidden="true">${n}</span></button>`; }).join('')}
    </div></div>`;
}
function wireStatusFilterTabs(el, onPick){
  el.querySelectorAll('[data-status-tab]').forEach(b=>b.addEventListener('click', ()=>onPick(b.getAttribute('data-status-tab'))));
  const strip = el.querySelector('.status-tabs'), on = strip && strip.querySelector('.status-tab.on');
  if(strip && on && strip.scrollWidth > strip.clientWidth){
    const left = on.offsetLeft - strip.offsetLeft, right = left + on.offsetWidth;
    if(left < strip.scrollLeft || right > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = Math.max(0, left - 16);
  }
}

function mountCalendarPage(el){
  const st = UI_STATE.calendar;
  const mk = st.month;
  const [y, m] = mk.split('-').map(Number);
  const fdow = clamp(Math.floor(safeNum(STORE.state.settings.firstDayOfWeek, 0)), 0, 6);
  const first = new Date(y, m-1, 1);
  const lead = (first.getDay() - fdow + 7) % 7;
  const dim = daysInMonth(y, m-1);
  const cells = Math.ceil((lead + dim) / 7) * 7;
  const gridStart = localDateISO(new Date(y, m-1, 1 - lead));
  const gridEnd = addDaysISO(gridStart, cells - 1);
  const allOccs = getAllOccurrences({ start: gridStart, end: gridEnd });
  const monthAll = allOccs.filter(o=>o.date >= monthStartISO(mk) && o.date <= monthEndISO(mk));
  const filter = STATUS_FILTERS.indexOf(st.status) !== -1 ? st.status : 'all';
  const calCounts = { all: monthAll.length };
  STATUS_FILTERS.slice(1).forEach(k=>{ calCounts[k] = monthAll.filter(o=>o.status===k).length; });
  const occs = filter === 'all' ? allOccs : allOccs.filter(o=>o.status===filter);
  const byDate = new Map();
  occs.forEach(o=>{ if(!byDate.has(o.date)) byDate.set(o.date, []); byDate.get(o.date).push(o); });
  const monthOccs = occs.filter(o=>o.date >= monthStartISO(mk) && o.date <= monthEndISO(mk));
  const tot = totalsOf(monthAll);
  const today = todayISO();
  const MAX_CHIPS = 3;
  let grid = '';
  for(let i=0;i<cells;i++){
    const iso = addDaysISO(gridStart, i);
    const list = byDate.get(iso) || [];
    const inMonth = iso.slice(0,7) === mk;
    const dayNum = Number(iso.slice(8));
    grid += `<div class="cal-cell ${inMonth?'':'out'} ${iso===today?'today':''}" role="gridcell" aria-label="${escapeHtml(fmtDateLong(iso) + (list.length ? ' — ' + t('calendar.billsCount', { n:list.length }) : ''))}">
      <div class="cal-day"><span>${dayNum}</span>${list.length ? `<button type="button" class="cal-count" data-day="${iso}" aria-label="${escapeHtml(t('calendar.openDay', { date: fmtDate(iso) }))}">${list.length}</button>` : ''}</div>
      <div class="cal-chips">${list.slice(0, MAX_CHIPS).map(o=>`<button type="button" class="cal-chip status-${o.status}" data-open-occ="${escapeHtml(o.billId)}" data-date="${iso}" title="${escapeHtml(o.bill.name + ' — ' + formatMoneyText(o.expected) + ' — ' + statusLabel(o.status))}">
          <span class="chip-ic" aria-hidden="true">${STATUS_META[o.status].icon}</span><span class="chip-name">${escapeHtml(o.bill.name)}</span><span class="chip-amt">${fmtMoney(o.status==='paid'?o.expected:o.remaining)}</span><span class="visually-hidden">${escapeHtml(statusLabel(o.status))}</span></button>`).join('')}
        ${list.length > MAX_CHIPS ? `<button type="button" class="cal-more" data-day="${iso}">${escapeHtml(t('calendar.more', { n: list.length - MAX_CHIPS }))}</button>` : ''}
      </div></div>`;

function mountYearlyPage(el){
  const st = UI_STATE.yearly;
  const year = st.year;
  const header = pageHeader('nav.yearly', 'yearly.intro', `<button class="btn btn-accent" type="button" data-action="add-bill">+ ${escapeHtml(t('bills.addBill'))}</button>`);
  const catOpts = sortByLabel(STORE.state.categories, categoryLabel).map(c=>[c.id, categoryLabel(c)]);
  const yr = yearRange(year);
  const scope = { category: st.category, bill: st.bill };
  const bills = sortByLabel(getBills().filter(b=>billMatchesScope(b, scope)), b=>b.name);
  const rows = bills.map(b=>{
    const occs = getBillOccurrences(b, yr.start, yr.end);
    const months = [];
    for(let m=0;m<12;m++){ const mk = year + '-' + String(m+1).padStart(2,'0'); months.push(occs.filter(o=>o.date.slice(0,7)===mk)); }
    return { bill:b, occs, months, tot: totalsOf(occs) };
  }).filter(r=>r.occs.length);
  /* Status filter: uses the statuses the occurrence/status engine already
     produced for these rows — no second calculation, no copied data. */
  const statusCounts = { all: rows.length };
  STATUS_FILTERS.slice(1).forEach(k=>{ statusCounts[k] = rows.filter(r=>r.occs.some(o=>o.status===k)).length; });
  const filter = STATUS_FILTERS.indexOf(st.status) !== -1 ? st.status : 'all';
  const shownRows = filter === 'all' ? rows : rows.filter(r=>r.occs.some(o=>o.status===filter));
  const yt = getYearlyTotals(year, scope);
  const worst = list=>{ for(const s of ['overdue','partial','dueToday','upcoming','paid']) if(list.some(o=>o.status===s)) return s; return 'paid'; };
  const visMonths = Array.from({length:12}, (_,m)=>m);
  const listFor = (r, m)=> r.months[m];
  const rowTot = r=> r.tot;
  const cellHtml = (r, list, m)=>{
    if(!list.length) return `<td class="yt-cell empty" data-label="${escapeHtml(monthShortName(m))}"><span aria-hidden="true">·</span><span class="visually-hidden">${escapeHtml(t('yearly.noDue'))}</span></td>`;
    const s = worst(list);
    const paidN = list.filter(o=>o.status==='paid').length;
    const label = list.length > 1 ? `${paidN}/${list.length}` : statusLabel(s);
    const aria = `${r.bill.name}, ${monthShortName(m)} ${year}: ${list.map(o=>fmtDate(o.date)+' '+statusLabel(o.status)+' '+formatMoneyText(o.expected)).join('; ')}`;
    const match = filter !== 'all' && list.some(o=>o.status===filter);
    return `<td class="yt-cell" data-label="${escapeHtml(monthShortName(m))}"><button type="button" class="yt-btn status-${s}${match ? ' yt-match match-' + filter : ''}" data-yt-bill="${escapeHtml(r.bill.id)}" data-yt-month="${m}" aria-label="${escapeHtml(aria)}" title="${escapeHtml(aria)}">
      <span class="chip-ic" aria-hidden="true">${STATUS_META[s].icon}</span><span class="yt-label${list.length === 1 ? ' yt-label-status' : ''}">${escapeHtml(label)}</span></button></td>`;
  };
  el.innerHTML = `${header}
    <div class="card">
      <div class="yt-toolbar">
        <div class="row" style="gap:6px;">
          <button class="btn btn-outline btn-icon" type="button" id="yt-prev" aria-label="${escapeHtml(t('yearly.prevYear'))}">&#8249;</button>
          <label class="inline-select"><span class="visually-hidden">${escapeHtml(t('common.year'))}</span>${selectHtml('yt-year', String(year), yearOptions(), t('common.year'))}</label>
          <button class="btn btn-outline btn-icon" type="button" id="yt-next" aria-label="${escapeHtml(t('yearly.nextYear'))}">&#8250;</button>
        </div>
        <div class="filter-bar compact">
          ${filterField(t('common.category'), selectHtml('yt-category', st.category, catOpts, t('common.category'), t('common.allCategories')))}
          ${filterField(t('common.bill'), selectHtml('yt-bill', st.bill, billOptions(true), t('common.bill'), t('common.allBills')))}
        </div>
      </div>
      <div class="yt-summary">
        <span>${escapeHtml(t('common.expected'))}: <strong>${fmtMoney(yt.expected)}</strong></span>
        <span>${escapeHtml(t('common.paid'))}: <strong>${fmtMoney(yt.paid)}</strong></span>
        <span>${escapeHtml(t('common.remaining'))}: <strong>${fmtMoney(yt.remaining)}</strong></span>
        <span>${escapeHtml(t('yearly.progress'))}: <strong>${escapeHtml(fmtPct(yt.progress, 0))}</strong></span>
      </div>
      ${rows.length ? statusFilterTabs({ id:'yt-status', idPrefix:'yt-status-', tabs: STATUS_FILTERS, active: filter, counts: statusCounts, labelFor: k=>k==='all' ? t('bills.tab.all') : statusLabel(k), groupLabel: t('common.paymentStatus') })
        + `<div class="result-meta" aria-live="polite">${escapeHtml(t('yearly.showingBills', { n: shownRows.length, total: rows.length }))}</div>` : ''}
      ${rows.length && !shownRows.length ? emptyState('&#128269;', t('yearly.noMatchTitle'), t('yearly.noMatchText', { status: statusLabel(filter), year }),
          emptyActionButtons([`<button class="btn btn-accent btn-sm" type="button" id="yt-show-all">${escapeHtml(t('yearly.showAll'))}</button>`])) : ''}
      ${shownRows.length ? `<div class="yt-scroll" tabindex="0" role="region" aria-label="${escapeHtml(t('yearly.matrixAria', { year }))}"><table class="yt-table yt-grid">
        <thead><tr><th scope="col" class="yt-name">${escapeHtml(t('common.bill'))}</th>${visMonths.map(m=>`<th scope="col" class="yt-month">${escapeHtml(monthShortName(m))}</th>`).join('')}<th scope="col" class="num yt-money yt-money-first">${escapeHtml(t('common.paid'))}</th><th scope="col" class="num yt-money">${escapeHtml(t('common.expected'))}</th></tr></thead>
        <tbody>${shownRows.map(r=>{ const rt = rowTot(r); return `<tr><th scope="row" class="yt-name"><button type="button" class="link-btn strong" data-bill-view="${escapeHtml(r.bill.id)}">${escapeHtml(r.bill.name)}</button>
            <div class="hint">${escapeHtml(categoryName(r.bill.categoryId))} · ${escapeHtml(frequencyLabel(r.bill.frequency))}${r.bill.archived ? ' · ' + escapeHtml(t('common.archived')) : ''}</div></th>
            ${visMonths.map(m=>cellHtml(r, listFor(r, m), m)).join('')}
            <td class="num yt-money yt-money-first"><strong>${fmtMoney(rt.paid)}</strong></td><td class="num yt-money">${fmtMoney(rt.expected)}</td></tr>`; }).join('')}</tbody>
        ${(()=>{ const ft = m=> yt.months[m];
          const gt = yt;
          return `<tfoot><tr class="yt-foot-paid"><th scope="row" class="yt-name">${escapeHtml(t('yearly.totalPaid'))}</th>${visMonths.map(m=>{ const x = ft(m); return `<td class="yt-foot">${x.expected>0 ? fmtMoney(x.paid) : '—'}</td>`; }).join('')}
            <td class="num yt-money yt-money-first"><strong>${fmtMoney(gt.paid)}</strong></td><td class="num yt-money yt-blank"></td></tr>
            <tr class="yt-foot-exp"><th scope="row" class="yt-name">${escapeHtml(t('yearly.totalExpected'))}</th>${visMonths.map(m=>{ const x = ft(m); return `<td class="yt-foot">${x.expected>0 ? fmtMoney(x.expected) : '—'}</td>`; }).join('')}
            <td class="num yt-money yt-money-first yt-blank"></td><td class="num yt-money"><strong>${fmtMoney(gt.expected)}</strong></td></tr></tfoot>`; })()}
      </table></div>` : rows.length ? '' : emptyState('&#128198;', t('yearly.emptyTitle'), t(hasBills() ? 'yearly.emptyFiltered' : 'yearly.emptyText'),
        hasBills() ? '' : emptyActionButtons([`<button class="btn btn-accent" type="button" data-action="add-bill">${escapeHtml(t('bills.addBill'))}</button>`]))}
    </div>`;
  const re = ()=>remount(el, mountYearlyPage);
  wireCommonActions(el);
  el.querySelector('#yt-prev').addEventListener('click', ()=>{ st.year--; re(); });
  el.querySelector('#yt-next').addEventListener('click', ()=>{ st.year++; re(); });
  el.querySelector('#yt-year').addEventListener('change', e=>{ st.year = Number(e.target.value); re(); });
  el.querySelector('#yt-category').addEventListener('change', e=>{ st.category = e.target.value; re(); });
  el.querySelector('#yt-bill').addEventListener('change', e=>{ st.bill = e.target.value; re(); });
  wireStatusFilterTabs(el, k=>{ st.status = k; re(); });
  const showAll = el.querySelector('#yt-show-all');
  if(showAll) showAll.addEventListener('click', ()=>{ st.status = 'all'; re(); const a = document.getElementById('yt-status-all'); if(a) a.focus(); });
  el.querySelectorAll('[data-bill-view]').forEach(b=>b.addEventListener('click', ()=>openBillDetails(b.getAttribute('data-bill-view'))));
  el.querySelectorAll('[data-yt-bill]').forEach(btn=>btn.addEventListener('click', ()=>{
    const r = rows.find(x=>x.bill.id===btn.getAttribute('data-yt-bill'));
    const list = r ? listFor(r, Number(btn.getAttribute('data-yt-month'))) : [];
    if(list.length === 1) openOccurrenceModal(list[0].billId, list[0].date);
    else if(list.length > 1) openModal({
      title: r.bill.name + ' — ' + monthLabel(year + '-' + String(Number(btn.getAttribute('data-yt-month'))+1).padStart(2,'0')),
      bodyHtml: occurrenceListHtml(list, { showDate:true }),
      footerHtml: `<button class="btn btn-outline" type="button" data-close-modal="1">${escapeHtml(t('common.close'))}</button>`,
      onMount(box){ wireOccurrenceList(box); }
    });
  }));
}

const REPORT_TABS = ['monthly','annual','category','status','overdue','trend','expectedPaid','methods'];
const YEAR_REPORTS = ['monthly','annual','trend','expectedPaid'];
function reportTable(headers, rows, footer){
  return `<div class="table-wrap"><table class="data responsive"><thead><tr>${headers.map((h,i)=>`<th scope="col" class="${i>0?'num':''}">${escapeHtml(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i>0?'num':''}" data-label="${escapeHtml(headers[i])}">${c}</td>`).join('')}</tr>`).join('')}</tbody>
    ${footer ? `<tfoot><tr>${footer.map((c,i)=>`<td class="${i>0?'num':''}" data-label="${escapeHtml(headers[i])}"><strong>${c}</strong></td>`).join('')}</tr></tfoot>` : ''}</table></div>`;

function mountReportsPage(el){
  const st = UI_STATE.reports;
  const header = pageHeader('nav.reports', 'reports.intro');
  if(!hasBills()){
    el.innerHTML = header + `<div class="card">${emptyState('&#128202;', t('reports.emptyTitle'), t('reports.emptyText'), emptyActionButtons([
      `<button class="btn btn-accent" type="button" data-action="add-bill">${escapeHtml(t('bills.addBill'))}</button>`, `<button class="btn btn-outline" type="button" data-action="load-demo">${escapeHtml(t('data.loadDemo'))}</button>`]))}</div>`;
    wireCommonActions(el);
    return;
  }
  const scope = { category: st.category, bill: st.bill };
  const isYear = YEAR_REPORTS.indexOf(st.tab) !== -1;
  const range = activeRange('reports');
  const catOpts = sortByLabel(STORE.state.categories, categoryLabel).map(c=>[c.id, categoryLabel(c)]);
  let body = '', csv = null;
  const money = v=>fmtMoney(v);
  if(!isYear && !range){
    body = `<p class="hint">${escapeHtml(t('dateRange.invalidRangeTitle'))}</p>`;
  } else if(st.tab === 'monthly' || st.tab === 'expectedPaid' || st.tab === 'trend' || st.tab === 'annual'){
    const yt = getYearlyTotals(st.year, scope);
    const months = yt.months;
    const labels = months.map(m=>monthShortName(m.month));
    if(st.tab === 'monthly'){

function reportKpis(items){
  return `<div class="report-kpis">${items.map(([l,v])=>`<div class="report-kpi"><span class="hint">${escapeHtml(l)}</span><strong>${v}</strong></div>`).join('')}</div>`;
}
function onTimeRate(occs){
  const due = occs.filter(o=>o.date < todayISO() || o.status==='paid');
  const done = due.filter(o=>o.status==='paid');
  if(!due.length) return 0;
  return done.filter(o=>!o.paidLate).length / due.length * 100;
}

    <span class="hint">${escapeHtml(t(listKey==='categories' ? 'settings.usedByBills' : 'settings.usedByRecords', { n: usage(x.id) }))}</span>

    ${archived.length ? `<details class="archived-list"><summary>${escapeHtml(t('settings.archivedCount', { count: archived.length }))}</summary><ul class="list-rows">${archived.map(row).join('')}</ul></details>` : ''}

function openRenameModal(listKey, id){
  const labelFn = listKey === 'categories' ? categoryLabel : methodLabel;
  const item = (STORE.state[listKey]||[]).find(x=>x.id===id);
  if(!item) return;
  const render = (val, err)=>openModal({
    title: t('common.rename'),
    bodyHtml: `<form id="rename-form" novalidate>${textField({ id:'rename-name', label:t('common.name'), value:val, maxlength:60, required:true, error:err })}</form>`,
    footerHtml: `<button class="btn btn-outline" type="button" data-close-modal="1">${escapeHtml(t('common.cancel'))}</button><button class="btn btn-accent" type="button" id="rename-save-btn">${escapeHtml(t('common.save'))}</button>`,
    onMount(box){
      box.querySelector('#rename-form').addEventListener('submit', e=>{ e.preventDefault(); box.querySelector('#rename-save-btn').click(); });
      box.querySelector('#rename-save-btn').addEventListener('click', ()=>{
        const v = box.querySelector('#rename-name').value;
        const res = saveListItem(listKey, v, id);
        if(!res.ok){ render(v, res.error); return; }
        closeModal();
      });
    }
  });
  render(labelFn(item), '');
}

function importBackupFile(file){
  if(file.size > 20 * 1024 * 1024){ showImportErrors([t('data.fileTooLarge')]); return; }
  const reader = new FileReader();
  reader.onerror = ()=>showImportErrors([t('data.couldNotRead')]);
  reader.onload = ()=>{
    let parsed = null;
    try{ parsed = JSON.parse(String(reader.result || '')); }catch(e){ showImportErrors([t('data.notJson')]); return; }
    const data = isPlainObject(parsed) && isPlainObject(parsed.data) && parsed.format === 'ydc-bill-payment-calendar-backup' ? parsed.data : parsed;
    const errors = validateStateShape(data, { strict:true });
    if(errors.length){ showImportErrors(errors); return; }
    const bills = data.bills.length, pays = data.payments.length;
    confirmAction(t('data.importConfirm', { bills, payments: pays }), ()=>{
      const migrated = migrateState(JSON.parse(JSON.stringify(data)));
      const ok = STORE.mutate(s=>{ Object.keys(s).forEach(k=>delete s[k]); Object.assign(s, migrated); });
      if(ok) toast(t('data.toastImported'), 'success');
    }, { title: t('data.importJson'), confirmLabel: t('data.importReplace') });
  };
  reader.readAsText(file);
}

    if(ok){
      resetViewState();
      toast(t('data.toastStartedFresh'), 'success');

    }

}
function confirmLoadDemo(){
  const hasData = hasBills() || hasPayments();
  confirmAction(t(hasData ? 'data.loadDemoConfirmReplace' : 'data.loadDemoConfirm'), ()=>{

/* Filters store record ids. If the record they point to no longer exists (bill deleted,
   backup imported, data replaced) the <select> falls back to "All" visually while the stale id
   would still filter every row out. Drop such dangling ids before each render. */
function pruneStaleFilters(){
  const s = STORE.state; if(!s) return;
  const has = (arr, id)=> !id || (arr||[]).some(x=>x.id===id);
  [UI_STATE.payments, UI_STATE.yearly, UI_STATE.reports].forEach(st=>{ if(!has(s.bills, st.bill)) st.bill = ''; });
  [UI_STATE.bills, UI_STATE.payments, UI_STATE.yearly, UI_STATE.reports].forEach(st=>{ if(!has(s.categories, st.category)) st.category = ''; });
  [UI_STATE.bills, UI_STATE.payments].forEach(st=>{ if(!has(s.paymentMethods, st.method)) st.method = ''; });
}
function resetViewState(){
  Object.assign(UI_STATE.bills, { tab:'all', q:'', category:'', frequency:'', type:'', method:'', range:'all', customStart:'', customEnd:'' });
  Object.assign(UI_STATE.payments, { q:'', bill:'', category:'', method:'', min:'', max:'', range:'all', customStart:'', customEnd:'', limit:50 });
  Object.assign(UI_STATE.yearly, { category:'', bill:'' });
  Object.assign(UI_STATE.reports, { category:'', bill:'' });
}
/* Demo data is generated relative to TODAY so every status is represented. It is only
   ever created by the explicit "Load Demo Data" action. Names use the current language. */
function generateDemoData(){
  const T = todayISO();
  const now = parseDateOnlyLocal(T);
  const monthsAgo = (n, day)=>{ const f = new Date(now.getFullYear(), now.getMonth() - n, 1); return localDateISO(new Date(f.getFullYear(), f.getMonth(), Math.min(day, daysInMonth(f.getFullYear(), f.getMonth())))); };
  let seed = 20260915;
  const rand = ()=>{ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const ts = nowISO();
  const bills = [], payments = [];
  const mk = (key, o)=>{ const b = Object.assign({ id:'bill_demo_'+key, name:t('demo.bill.'+key), notes:'', autoPay:false, archived:false, active:true, archivedAt:'', overrides:{}, createdAt:ts, updatedAt:ts }, o); bills.push(b); return b; };
  const pay = (b, occ, date, amount, notes)=>payments.push({ id: uid('pay'), billId:b.id, occurrenceDate:occ, paymentDate:date, amount:round2(amount), paymentMethodId:b.paymentMethodId || 'pm_bankTransfer', notes: notes||'', createdAt:ts, updatedAt:ts });
  const payHistory = (b, opts)=>{
    opts = opts || {};
    scheduleDates(b, b.dueDate, T).forEach((d, i)=>{
      if(opts.skip && opts.skip(d, i)) return;
      const exp = getExpectedAmount(b, d);
      const early = Math.floor(rand() * 4);
      let date = addDaysISO(d, -early);
      if(opts.late && opts.late(d, i)) date = addDaysISO(d, 4 + Math.floor(rand()*4));
      if(date > T) date = T;
      pay(b, d, date, opts.amount ? opts.amount(exp, d, i) : exp);
    });
  };
  const rent = mk('rent', { categoryId:'cat_housing', billType:'fixed', amount:1200, frequency:'monthly', dueDate: monthsAgo(11, 1), paymentMethodId:'pm_bankTransfer', notes:t('demo.note.rent') });
  payHistory(rent);
  const elec = mk('electricity', { categoryId:'cat_utilities', billType:'variable', amount:120, frequency:'monthly', dueDate: monthsAgo(11, 15), paymentMethodId:'pm_debitCard' });
  const elecAmts = [138, 142, 128, 115, 98, 92, 105, 126, 143, 131, 112, 101, 120];
  scheduleDates(elec, elec.dueDate, addDaysISO(T, 60)).forEach((d,i)=>{ elec.overrides[d] = elecAmts[i % elecAmts.length]; });
  payHistory(elec, { late:(d,i)=>i===4 });
  const internet = mk('internet', { categoryId:'cat_utilities', billType:'fixed', amount:60, frequency:'monthly', dueDate: addMonthsClampedISO(addDaysISO(T, 5), -11), paymentMethodId:'pm_directDebit', autoPay:true });
  payHistory(internet);
  const netflix = mk('streaming', { categoryId:'cat_subscriptions', billType:'fixed', amount:15.99, frequency:'monthly', dueDate: monthsAgo(11, 8), paymentMethodId:'pm_creditCard', autoPay:true });
  payHistory(netflix);
  const home = mk('homeInsurance', { categoryId:'cat_insurance', billType:'fixed', amount:500, frequency:'annual', dueDate: addDaysISO(T, -10), paymentMethodId:'pm_bankTransfer' });
  pay(home, home.dueDate, addDaysISO(T, -8), 200, t('demo.note.partial'));
  mk('carInsurance', { categoryId:'cat_insurance', billType:'fixed', amount:850, frequency:'annual', dueDate: addDaysISO(T, -12), paymentMethodId:'pm_bankTransfer' });
  const phone = mk('phone', { categoryId:'cat_utilities', billType:'fixed', amount:45, frequency:'monthly', dueDate: addMonthsClampedISO(T, -11), paymentMethodId:'pm_mobilePayment' });
  payHistory(phone, { skip:(d)=>d===T });
  const water = mk('water', { categoryId:'cat_utilities', billType:'variable', amount:70, frequency:'quarterly', dueDate: monthsAgo(11, 10), paymentMethodId:'pm_bankTransfer' });
  scheduleDates(water, water.dueDate, addDaysISO(T, 120)).forEach((d,i)=>{ water.overrides[d] = [64, 78, 91, 73, 69][i % 5]; });
  payHistory(water);
  const gym = mk('gym', { categoryId:'cat_healthcare', billType:'fixed', amount:25, frequency:'biweekly', dueDate: addDaysISO(T, -14*20 + 3), paymentMethodId:'pm_debitCard' });
  payHistory(gym);
  const loan = mk('carLoan', { categoryId:'cat_debt', billType:'fixed', amount:320, frequency:'monthly', dueDate: monthsAgo(11, 20), paymentMethodId:'pm_directDebit', autoPay:true });
  payHistory(loan, { amount:(exp,d,i)=> i===6 ? 350 : exp });
  const tax = mk('propertyTax', { categoryId:'cat_taxes', billType:'fixed', amount:900, frequency:'semiannual', dueDate: monthsAgo(9, 30), paymentMethodId:'pm_bankTransfer' });
  payHistory(tax);
  const card = mk('creditCard', { categoryId:'cat_debt', billType:'variable', amount:250, frequency:'monthly', dueDate: monthsAgo(11, 25), paymentMethodId:'pm_bankTransfer' });
  const cardAmts = [310, 245, 280, 190, 265, 330, 215, 240, 298, 205, 260, 275, 250];
  scheduleDates(card, card.dueDate, addDaysISO(T, 60)).forEach((d,i)=>{ card.overrides[d] = cardAmts[i % cardAmts.length]; });
  scheduleDates(card, card.dueDate, T).forEach((d,i)=>{
    const exp = getExpectedAmount(card, d);
    if(i === 3){ pay(card, d, addDaysISO(d, -6), 100, t('demo.note.split')); pay(card, d, addDaysISO(d, -1), exp - 100, t('demo.note.split')); }
    else pay(card, d, addDaysISO(d, -2), exp);
  });
  mk('registration', { categoryId:'cat_transportation', billType:'fixed', amount:150, frequency:'once', dueDate: addDaysISO(T, 20), paymentMethodId:'pm_creditCard' });
  const course = mk('course', { categoryId:'cat_education', billType:'fixed', amount:199, frequency:'once', dueDate: addDaysISO(T, -40), paymentMethodId:'pm_creditCard' });
  pay(course, course.dueDate, addDaysISO(T, -35), 199);
  const cleaning = mk('cleaning', { categoryId:'cat_household', billType:'fixed', amount:80, frequency:'monthly', dueDate: monthsAgo(11, 5), paymentMethodId:'pm_cash', archived:true, active:false, archivedAt: monthsAgo(3, 28), notes:t('demo.note.archived') });
  payHistory(cleaning);
  return { bills, payments };
}

  SHELL_CHROME_WIRED = true;
  const toggle = document.getElementById('sidebar-toggle');
  if(toggle) toggle.addEventListener('click', ()=>{ const sidebar=document.getElementById('sidebar'); if(sidebar && sidebar.classList.contains('open')) closeSidebar(); else openSidebar(); });
  const backdrop = document.getElementById('sidebar-backdrop');
  if(backdrop) backdrop.addEventListener('click', closeSidebar);
  const profileBtn = document.getElementById('profile-btn');
  if(profileBtn) profileBtn.addEventListener('click', ()=>{ openProfileManager(); });
  document.documentElement.lang = CURRENT_LANG;
  const langSelect = document.getElementById('lang-select');
  if(langSelect){
    langSelect.value = CURRENT_LANG;
    langSelect.addEventListener('change', (e)=>{ setLanguage(e.target.value); });
  }
  window.addEventListener('resize', ()=>{ updateNavCollapse(); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ updateNavCollapse(); drawCharts(document.getElementById('content')); }).catch(()=>{});
  window.addEventListener('resize', debounce(()=>drawCharts(document.getElementById('content')), 160));
  refreshStaticChromeText();
}
function refreshStaticChromeText(){
  const profileBtn = document.getElementById('profile-btn');
  if(profileBtn) profileBtn.textContent = t('shell.profile');
  const toggle = document.getElementById('sidebar-toggle');
  if(toggle) syncSidebarAccessibility(document.getElementById('sidebar')?.classList.contains('open') || false);
  const foot = document.querySelector('#sidebar .foot');
  if(foot) foot.textContent = 'Bill Payment Tracker · ' + t('shell.allDataStoredLocally');
}

/* ============================================================
   29. BOOTSTRAP
   ============================================================ */
function initApp(){
  STORE.load();
  // First run on this device (storage key never created): preload the
  // existing demo data, exactly as "Load Demo Data" does, and save it so
  // refreshes are stable. After Start Fresh the key exists, so this never re-runs.
  if(STORE.storageWasEmpty){
    try{
      const demo = generateDemoData();
      const cats = seedCategories(), methods = seedPaymentMethods();
      STORE.state.categories = cats; STORE.state.paymentMethods = methods;
      STORE.state.bills = demo.bills; STORE.state.payments = demo.payments;
    }catch(e){ console.warn('Demo data could not be preloaded; starting empty.', e); }
    STORE.save();
  }
  initShellChrome();
  STORE.render();
  if(SAVE_OK === false){
    toast(t('backup.saveFailedWarning'), 'error');
  }
  if(STORE.loadWarning){
    toast(t('backup.recoveryKept'), 'warning', { duration: 9000 });
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
