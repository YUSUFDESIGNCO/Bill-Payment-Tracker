/* ---------- Help ---------- */
"guide.pageTitle":"Guía del Usuario",
"guide.intro":"Ayuda paso a paso para cada parte de Bill Payment Tracker.",
"help.tabsAria":"Páginas de ayuda",
"help.expandAll":"Expandir todo",
"help.collapseAll":"Contraer todo",
"ug.gettingStarted.title":"Primeros Pasos",
"ug.gettingStarted.intro":"Bill Payment Tracker reúne todas tus facturas, vencimientos y pagos en un solo lugar, completamente en tu dispositivo.",
"ug.gettingStarted.steps":"Abre Perfil (arriba a la derecha) e introduce tu nombre.|En Configuración, elige tu moneda, formato de fecha y primer día de la semana.|Añade tu primera factura o elige Cargar Datos de Ejemplo en Configuración para explorar.|Usa el menú para moverte entre Panel, Facturas, Calendario, Pagos, Seguimiento Anual e Informes.",
"ug.addBill.title":"Añadir una Factura",
"ug.addBill.intro":"Una factura describe algo que pagas una vez o de forma periódica.",
"ug.addBill.steps":"Haz clic en Añadir Factura en la página Facturas (o en el Panel o el Calendario).|Introduce el nombre, elige una categoría e indica si es Fija o Variable.|Introduce el importe previsto, la frecuencia y el primer vencimiento.|Opcionalmente añade método de pago, pago automático y notas, y haz clic en Añadir Factura.",
"ug.recurring.title":"Facturas Periódicas",
"ug.recurring.intro":"Una factura periódica crea un vencimiento independiente para cada periodo. Cada vencimiento tiene su propio importe previsto, pagos y estado.",
"ug.recurring.steps":"Elige Semanal, Quincenal, Mensual, Trimestral, Semestral o Anual como frecuencia.|Los vencimientos se repiten desde el primer vencimiento según la frecuencia.|Si el día no existe en un mes (por ejemplo el 31), se usa el último día de ese mes.|Pagar un vencimiento nunca cambia otro.",
"ug.fixedVariable.title":"Facturas Fijas y Variables",
"ug.fixedVariable.intro":"Las facturas fijas esperan siempre el mismo importe. Las variables, como la electricidad, pueden esperar un importe distinto en cada vencimiento.",
"ug.fixedVariable.steps":"Elige Variable al añadir la factura e introduce una estimación habitual.|Abre un vencimiento desde el Calendario, el Seguimiento Anual o los detalles de la factura.|Haz clic en Editar importe previsto e introduce el importe real de ese periodo.|Restablecer predeterminado vuelve a la estimación solo para ese vencimiento.",
"ug.payments.title":"Registrar Pagos",
"ug.payments.intro":"Los pagos son registros independientes vinculados a una factura y a un vencimiento concreto.",
"ug.payments.steps":"Haz clic en Pagar junto a una factura o en el calendario, o en Registrar Pago en la página Pagos.|Elige la factura y el vencimiento al que corresponde el pago.|Introduce la fecha, el importe y el método, y haz clic en Registrar Pago.|Todas las páginas —Panel, Calendario, Seguimiento Anual e Informes— se actualizan al instante.",
"ug.partial.title":"Pagos Parciales y de Más",
"ug.partial.intro":"Un vencimiento puede recibir cualquier número de pagos.",
"ug.partial.steps":"Si lo pagado es menor que lo previsto, el estado es Parcial y se muestra lo pendiente.|Registra otro pago para el mismo vencimiento para completarlo; el estado pasa a Pagada.|Si pagas más de lo previsto, el estado es Pagada y el exceso se muestra como Pagado de más.|Edita o elimina un pago desde la página Pagos o los detalles de la factura.",
"ug.calendar.title":"Calendario",
"ug.calendar.intro":"El Calendario muestra cada vencimiento del mes con su importe y estado.",
"ug.calendar.steps":"Usa las flechas para cambiar de mes u Hoy para volver.|Haz clic en una entrada para ver sus detalles y pagos; usa Pagar para registrar un pago.|Si un día tiene muchas facturas, haz clic en «+ más» para verlas todas.|En el móvil, toca el número del día o usa la lista bajo el calendario.",
"ug.yearly.title":"Seguimiento Anual",
"ug.yearly.intro":"El Seguimiento Anual muestra cada factura a lo largo de los doce meses del año.",
"ug.yearly.steps":"Elige un año con las flechas o el selector de año.|Filtra por categoría o factura si lo necesitas.|Cada celda muestra el estado de ese mes; las facturas con varios vencimientos muestran pagados/total.|Haz clic en una celda para abrir ese vencimiento. En pantallas pequeñas, desplázate horizontalmente.",
"ug.dashboard.title":"Panel",
"ug.dashboard.intro":"El Panel resume tus facturas del periodo seleccionado.",
"ug.dashboard.steps":"Elige un periodo (Este Mes por defecto) para actualizar Total a Pagar, Total Pagado y Pendiente.|Vencido incluye siempre todos los vencimientos pasados sin pagar; Vence Pronto usa la ventana definida en Configuración.|Los gráficos muestran el progreso de pago, previsto vs pagado, gasto por categoría y la tendencia mensual.|Próximas Facturas y Pagos Recientes dan acceso rápido a lo importante ahora.",
"ug.reports.title":"Informes",
"ug.reports.intro":"Los informes analizan lo previsto, pagado, pendiente y vencido.",
"ug.reports.steps":"Elige un informe: Resumen Mensual o Anual, Gasto por Categoría, Pagado vs Pendiente, Análisis de Vencidos, Tendencia Mensual, Previsto vs Pagado o Métodos de Pago.|Usa el selector de año o periodo y los filtros de categoría y factura.|Haz clic en Exportar CSV para descargar la tabla del informe.",
"ug.categories.title":"Categorías",
"ug.categories.intro":"Las categorías agrupan las facturas para filtros e informes.",
"ug.categories.steps":"Ve a Configuración › Categorías.|Escribe un nombre y haz clic en Añadir, o en Renombrar para cambiarlo.|Archiva una categoría que ya no uses; las facturas existentes la conservan y el historial queda intacto.|Restáurala en cualquier momento desde la lista de archivadas.",
"ug.methods.title":"Métodos de Pago",
"ug.methods.intro":"Los métodos de pago registran cómo se hizo cada pago.",
"ug.methods.steps":"Ve a Configuración › Métodos de Pago.|Añade, renombra, archiva o restaura métodos.|Los métodos archivados se mantienen en los pagos anteriores y en los informes.",
"ug.backup.title":"Copia de Seguridad",
"ug.backup.intro":"Como los datos solo se guardan en este navegador, las copias periódicas te protegen.",
"ug.backup.steps":"Ve a Configuración › Gestión de Datos.|Haz clic en Exportar Copia JSON.|Guarda el archivo descargado en un lugar seguro, como una carpeta privada en la nube o una memoria USB.",
"ug.restore.title":"Restaurar",
"ug.restore.intro":"Una copia se puede restaurar en este u otro dispositivo.",
"ug.restore.steps":"Ve a Configuración › Gestión de Datos y haz clic en Elegir archivo de copia.|Selecciona una copia JSON de Bill Payment Tracker.|Primero se comprueba el archivo; si es válido, confirma para reemplazar tus datos actuales.",
"ug.demo.title":"Datos de Ejemplo",
"ug.demo.intro":"Los datos de ejemplo te permiten explorar la app con casos realistas. Nunca se cargan automáticamente.",
"ug.demo.steps":"Haz clic en Cargar Datos de Ejemplo en el Panel o en Configuración.|Si ya tienes datos, se descarga una copia antes de reemplazarlos.|Usa Empezar de Cero cuando quieras introducir tus propias facturas.",
"ug.startFresh.title":"Empezar de Cero",
"ug.startFresh.intro":"Empezar de Cero borra todas las facturas y pagos.",
"ug.startFresh.steps":"Ve a Configuración › Gestión de Datos y haz clic en Empezar de Cero.|Confirma; primero se descarga una copia JSON.|Se eliminan facturas y pagos y se restablecen categorías y métodos. Se conservan perfil, idioma y ajustes.",
"ug.offline.title":"Almacenamiento sin Conexión",
"ug.offline.intro":"La app es un único archivo que funciona sin internet.",
"ug.offline.steps":"Tus datos se guardan automáticamente en el almacenamiento local de este navegador.|No se envía nada a ningún servidor; no necesitas cuenta.|Borrar los datos del navegador o usar la navegación privada puede eliminarlos: exporta copias.",
"ug.languages.title":"Idiomas",
"ug.languages.intro":"La interfaz está disponible en inglés, español, portugués, francés y alemán.",
"ug.languages.steps":"Elige un idioma en el selector de la parte superior o en Configuración.|Tu elección se recuerda en este dispositivo.|Cambiar de idioma nunca cambia tus datos.",
"ug.currency.title":"Moneda",
"ug.currency.intro":"Todos los importes usan la moneda que elijas.",
"ug.currency.steps":"Ve a Configuración › Moneda y Formatos, o abre Perfil.|Elige tu moneda; todas las páginas, gráficos y exportaciones se actualizan.|Cambiar de moneda cambia cómo se muestran los importes; no convierte los valores.",
"faq.intro":"Respuestas a las preguntas más comunes sobre Bill Payment Tracker.",
"faq.storedOnline.q":"¿Mis datos se guardan en internet?",
"faq.storedOnline.a":"No. Todo se guarda localmente en este navegador de este dispositivo. La app no usa servidores, bases de datos ni APIs externas.",
"faq.offline.q":"¿Funciona la app sin conexión?",
"faq.offline.a":"Sí. Es un único archivo HTML autónomo con las fuentes integradas, así que funciona sin conexión a internet.",
"faq.recurring.q":"¿Cómo se gestionan las facturas periódicas?",
"faq.recurring.a":"Una factura periódica es un calendario. Cada vencimiento se sigue por separado con su propio importe previsto, pagos y estado, así que pagar septiembre nunca afecta a octubre.",
"faq.partial.q":"¿Puedo hacer pagos parciales?",
"faq.partial.a":"Sí. Registra tantos pagos como necesites para el mismo vencimiento. Se muestra como Parcial con lo pendiente hasta que el total alcanza lo previsto.",
"faq.overpay.q":"¿Puedo pagar de más?",
"faq.overpay.a":"Sí. El vencimiento se muestra como Pagada, lo pendiente pasa a 0 y el exceso aparece como Pagado de más en todas partes.",
"faq.overdue.q":"¿Cómo funciona el estado Vencida?",
"faq.overdue.a":"Un vencimiento está Vencido cuando es una fecha pasada y no se ha pagado nada. Si después se paga por completo, se muestra como Pagada con una nota de pago con retraso.",
"faq.archive.q":"¿Qué pasa al archivar una factura?",
"faq.archive.a":"Deja de crear vencimientos a partir de la fecha de archivo, pero sus vencimientos y pagos anteriores siguen en el Seguimiento Anual y en los Informes. Puedes restaurarla en cualquier momento.",
"faq.export.q":"¿Puedo exportar mis datos?",
"faq.export.a":"Sí. Exporta una copia JSON completa o archivos CSV de facturas, pagos y vencimientos desde Configuración › Gestión de Datos. Los informes también tienen Exportar CSV.",
"faq.restore.q":"¿Puedo restaurar una copia de seguridad?",
"faq.restore.a":"Sí. Elige el archivo de copia en Configuración › Gestión de Datos. Se valida antes de reemplazar nada y se te pide confirmación.",
"faq.autopay.q":"¿El pago automático marca las facturas como pagadas?",
"faq.autopay.a":"No. El pago automático es un recordatorio de que tu banco o proveedor cobra la factura automáticamente. El estado solo cambia cuando registras el pago.",
"faq.currency.q":"¿Cómo cambio la moneda?",
"faq.currency.a":"Abre Configuración › Moneda y Formatos (o Perfil) y elige una moneda. Los importes se muestran en la nueva moneda; los valores no se convierten.",
"faq.startFresh.q":"¿Cómo empiezo de cero?",
"faq.startFresh.a":"Usa Empezar de Cero en Configuración › Gestión de Datos. Primero se descarga una copia y después se eliminan todas las facturas y pagos.",
/* ---------- Privacy ---------- */
"privacy.title":"Política de Privacidad",
"privacy.intro":"Esta política explica cómo Bill Payment Tracker de Yusuf Design Co. trata la información que introduces.",
"privacy.s1.title":"Tus datos se quedan en tu dispositivo",
"privacy.s1.body":"Las facturas, pagos, categorías, métodos de pago, datos del perfil y ajustes se guardan en el almacenamiento local del navegador del dispositivo que usas. La app no los sube a ningún sitio.",
"privacy.s2.title":"Sin servidor, base de datos ni cuenta",
"privacy.s2.body":"La app funciona completamente en tu navegador. No requiere cuenta, no usa servidores ni bases de datos y no llama a APIs externas.",
"privacy.s3.title":"Sin seguimiento",
"privacy.s3.body":"La app no incluye analíticas, publicidad ni scripts de seguimiento, y no carga fuentes ni bibliotecas externas.",
"privacy.s4.title":"Tú controlas tus copias",
"privacy.s4.body":"Las copias de seguridad y exportaciones CSV solo se crean cuando decides exportarlas. Dónde guardas esos archivos y quién puede acceder a ellos depende de ti.",
"privacy.s5.title":"Borrar el almacenamiento del navegador",
"privacy.s5.body":"Borrar los datos del navegador, usar el modo privado o incógnito, desinstalar el navegador o restablecer el dispositivo puede eliminar tus datos. Exporta copias con regularidad.",
"privacy.s6.title":"Protege los archivos exportados",
"privacy.s6.body":"Los archivos exportados contienen tus registros financieros en formato legible. Guárdalos de forma segura y compártelos solo con personas de confianza.",
"privacy.s7.title":"Preguntas",
"privacy.s7.body":"Como la app nunca recibe tus datos, tú mismo puedes gestionar cualquier solicitud sobre tus registros: consultarlos, editarlos, exportarlos o eliminarlos en cualquier momento desde la app.",
/* ---------- Terms ---------- */
"terms.title":"Términos de Uso",
"terms.intro":"Al usar Bill Payment Tracker aceptas estos términos.",
"terms.s1.title":"Finalidad",
"terms.s1.body":"Bill Payment Tracker es una herramienta de organización personal para registrar facturas, vencimientos y pagos.",
"terms.s2.title":"Uso personal",
"terms.s2.body":"La app está pensada para la gestión doméstica y personal. No es un servicio bancario, de pagos ni de contabilidad, y no puede realizar pagos.",
"terms.s3.title":"Tus datos, tu responsabilidad",
"terms.s3.body":"Eres responsable de la información que introduces y de mantener seguros tu dispositivo y tu navegador.",
"terms.s4.title":"Copias de seguridad",
"terms.s4.body":"Los datos solo se guardan en tu navegador. Eres responsable de exportar y conservar copias de seguridad; Yusuf Design Co. no puede recuperar datos perdidos del navegador.",
"terms.s5.title":"Sin garantía de exactitud financiera",
"terms.s5.body":"Los totales, estados e informes se calculan a partir de los datos que introduces. La app se ofrece tal cual, sin garantía de que los resultados sean completos o exactos.",
"terms.s6.title":"No es asesoramiento profesional",
"terms.s6.body":"Nada en la app constituye asesoramiento financiero, fiscal, legal o profesional. Verifica los importes y plazos importantes con tus proveedores.",
"terms.s7.title":"Introducción correcta de datos",
"terms.s7.body":"Los recordatorios, avisos de vencimiento e informes dependen de importes y fechas correctos. Revisa tus datos y registra los pagos a tiempo.",
"terms.s8.title":"Cambios",
"terms.s8.body":"Las futuras versiones de la app pueden actualizar estos términos. Seguir usando una versión actualizada implica aceptar sus términos.",
},

"guide.pageTitle":"Guia do Usuário",
"guide.intro":"Ajuda passo a passo para cada parte do Bill Payment Tracker.",
"help.tabsAria":"Páginas de ajuda",
"help.expandAll":"Expandir tudo",
"help.collapseAll":"Recolher tudo",
"ug.gettingStarted.title":"Primeiros Passos",
"ug.gettingStarted.intro":"O Bill Payment Tracker reúne todas as suas contas, vencimentos e pagamentos em um só lugar, inteiramente no seu dispositivo.",
"ug.gettingStarted.steps":"Abra Perfil (canto superior direito) e informe seu nome.|Em Configurações, escolha a moeda, o formato de data e o primeiro dia da semana.|Adicione sua primeira conta ou escolha Carregar Dados de Exemplo em Configurações para explorar.|Use o menu para navegar entre Painel, Contas, Calendário, Pagamentos, Acompanhamento Anual e Relatórios.",
"ug.addBill.title":"Adicionar uma Conta",
"ug.addBill.intro":"Uma conta descreve algo que você paga uma vez ou periodicamente.",
"ug.addBill.steps":"Clique em Adicionar Conta na página Contas (ou no Painel ou no Calendário).|Informe o nome, escolha uma categoria e se ela é Fixa ou Variável.|Informe o valor previsto, a frequência e o primeiro vencimento.|Opcionalmente adicione forma de pagamento, débito automático e observações, e clique em Adicionar Conta.",
"ug.recurring.title":"Contas Recorrentes",
"ug.recurring.intro":"Uma conta recorrente gera um vencimento separado para cada período. Cada vencimento tem seu próprio valor previsto, pagamentos e status.",
"ug.recurring.steps":"Escolha Semanal, Quinzenal, Mensal, Trimestral, Semestral ou Anual como frequência.|Os vencimentos se repetem a partir do primeiro vencimento, conforme a frequência.|Quando o dia não existe em um mês (por exemplo, dia 31), é usado o último dia desse mês.|Pagar um vencimento nunca altera outro.",
"ug.fixedVariable.title":"Contas Fixas e Variáveis",
"ug.fixedVariable.intro":"Contas fixas preveem sempre o mesmo valor. Contas variáveis, como energia, podem prever um valor diferente em cada vencimento.",
"ug.fixedVariable.steps":"Escolha Variável ao adicionar a conta e informe uma estimativa típica.|Abra um vencimento pelo Calendário, pelo Acompanhamento Anual ou pelos detalhes da conta.|Clique em Editar valor previsto e informe o valor real daquele período.|Voltar ao padrão restaura a estimativa apenas para aquele vencimento.",
"ug.payments.title":"Registrar Pagamentos",
"ug.payments.intro":"Pagamentos são registros separados vinculados a uma conta e a um vencimento específico.",
"ug.payments.steps":"Clique em Pagar ao lado de uma conta ou no calendário, ou em Registrar Pagamento na página Pagamentos.|Escolha a conta e o vencimento a que o pagamento se refere.|Informe a data, o valor e a forma, e clique em Registrar Pagamento.|Todas as páginas — Painel, Calendário, Acompanhamento Anual e Relatórios — são atualizadas na hora.",
"ug.partial.title":"Pagamentos Parciais e a Mais",
"ug.partial.intro":"Um vencimento pode receber qualquer quantidade de pagamentos.",
"ug.partial.steps":"Se o total pago for menor que o previsto, o status é Parcial e o restante é exibido.|Registre outro pagamento para o mesmo vencimento para completá-lo; o status passa a Paga.|Se você pagar mais que o previsto, o status é Paga e o excedente aparece como Pago a mais.|Edite ou exclua um pagamento pela página Pagamentos ou pelos detalhes da conta.",
"ug.calendar.title":"Calendário",
"ug.calendar.intro":"O Calendário mostra cada vencimento do mês com valor e status.",
"ug.calendar.steps":"Use as setas para mudar de mês ou Hoje para voltar.|Clique em um item para ver detalhes e pagamentos; use Pagar para registrar um pagamento.|Quando um dia tem muitas contas, clique em “+ mais” para ver todas.|No celular, toque no número do dia ou use a lista abaixo do calendário.",
"ug.yearly.title":"Acompanhamento Anual",
"ug.yearly.intro":"O Acompanhamento Anual mostra cada conta ao longo dos doze meses do ano.",
"ug.yearly.steps":"Escolha um ano pelas setas ou pelo seletor de ano.|Filtre por categoria ou conta, se necessário.|Cada célula mostra o status do mês; contas com vários vencimentos mostram pagos/total.|Clique em uma célula para abrir o vencimento. Em telas pequenas, role para o lado.",
"ug.dashboard.title":"Painel",
"ug.dashboard.intro":"O Painel resume suas contas no período selecionado.",
"ug.dashboard.steps":"Escolha um período (Este Mês por padrão) para atualizar Total a Pagar, Total Pago e Restante.|Em Atraso inclui sempre todos os vencimentos passados não pagos; Vence em Breve usa a janela definida em Configurações.|Os gráficos mostram o progresso de pagamento, previsto vs pago, gastos por categoria e a tendência mensal.|Próximas Contas e Pagamentos Recentes dão acesso rápido ao que importa agora.",
"ug.reports.title":"Relatórios",
"ug.reports.intro":"Os relatórios analisam o previsto, pago, restante e em atraso.",
"ug.reports.steps":"Escolha um relatório: Resumo Mensal ou Anual, Gastos por Categoria, Pago vs Pendente, Análise de Atrasos, Tendência Mensal, Previsto vs Pago ou Formas de Pagamento.|Use o seletor de ano ou período e os filtros de categoria e conta.|Clique em Exportar CSV para baixar a tabela do relatório.",
"ug.categories.title":"Categorias",
"ug.categories.intro":"Categorias agrupam as contas para filtros e relatórios.",
"ug.categories.steps":"Vá em Configurações › Categorias.|Digite um nome e clique em Adicionar, ou em Renomear para alterá-lo.|Arquive uma categoria que não usa mais; as contas existentes a mantêm e o histórico fica intacto.|Restaure-a a qualquer momento pela lista de arquivadas.",
"ug.methods.title":"Formas de Pagamento",
"ug.methods.intro":"As formas de pagamento registram como cada pagamento foi feito.",
"ug.methods.steps":"Vá em Configurações › Formas de Pagamento.|Adicione, renomeie, arquive ou restaure formas.|Formas arquivadas permanecem nos pagamentos anteriores e nos relatórios.",
"ug.backup.title":"Backup",
"ug.backup.intro":"Como os dados ficam apenas neste navegador, backups regulares protegem você.",
"ug.backup.steps":"Vá em Configurações › Gerenciamento de Dados.|Clique em Exportar Backup JSON.|Guarde o arquivo baixado em local seguro, como uma pasta privada na nuvem ou um pendrive.",
"ug.restore.title":"Restaurar",
"ug.restore.intro":"Um backup pode ser restaurado neste ou em outro dispositivo.",
"ug.restore.steps":"Vá em Configurações › Gerenciamento de Dados e clique em Escolher arquivo de backup.|Selecione um backup JSON do Bill Payment Tracker.|O arquivo é verificado primeiro; se for válido, confirme para substituir seus dados atuais.",
"ug.demo.title":"Dados de Exemplo",
"ug.demo.intro":"Os dados de exemplo permitem explorar o app com casos realistas. Nunca são carregados automaticamente.",
"ug.demo.steps":"Clique em Carregar Dados de Exemplo no Painel ou em Configurações.|Se você já tem dados, um backup é baixado antes de substituí-los.|Use Começar do Zero quando quiser cadastrar suas próprias contas.",
"ug.startFresh.title":"Começar do Zero",
"ug.startFresh.intro":"Começar do Zero apaga todas as contas e pagamentos.",
"ug.startFresh.steps":"Vá em Configurações › Gerenciamento de Dados e clique em Começar do Zero.|Confirme; um backup JSON é baixado primeiro.|Contas e pagamentos são removidos e categorias e formas redefinidas. Perfil, idioma e configurações são mantidos.",
"ug.offline.title":"Armazenamento Offline",
"ug.offline.intro":"O app é um único arquivo que funciona sem internet.",
"ug.offline.steps":"Seus dados são salvos automaticamente no armazenamento local deste navegador.|Nada é enviado a servidores; não é preciso conta.|Limpar os dados do navegador ou usar a navegação privada pode apagá-los — exporte backups.",
"ug.languages.title":"Idiomas",
"ug.languages.intro":"A interface está disponível em inglês, espanhol, português, francês e alemão.",
"ug.languages.steps":"Escolha um idioma no seletor no topo da página ou em Configurações.|Sua escolha fica salva neste dispositivo.|Mudar de idioma nunca altera seus dados.",
"ug.currency.title":"Moeda",
"ug.currency.intro":"Todos os valores usam a moeda que você escolher.",
"ug.currency.steps":"Vá em Configurações › Moeda e Formatos, ou abra Perfil.|Escolha a moeda; todas as páginas, gráficos e exportações são atualizados.|Mudar a moeda altera apenas a exibição dos valores; eles não são convertidos.",
"faq.intro":"Respostas às perguntas mais comuns sobre o Bill Payment Tracker.",
"faq.storedOnline.q":"Meus dados ficam armazenados online?",
"faq.storedOnline.a":"Não. Tudo é armazenado localmente neste navegador, neste dispositivo. O app não usa servidor, banco de dados nem APIs externas.",
"faq.offline.q":"O app funciona offline?",
"faq.offline.a":"Sim. É um único arquivo HTML independente, com as fontes embutidas, então funciona sem conexão com a internet.",
"faq.recurring.q":"Como as contas recorrentes são tratadas?",
"faq.recurring.a":"Uma conta recorrente é um calendário. Cada vencimento é acompanhado separadamente, com seu próprio valor previsto, pagamentos e status; pagar setembro nunca afeta outubro.",
"faq.partial.q":"Posso fazer pagamentos parciais?",
"faq.partial.a":"Sim. Registre quantos pagamentos precisar para o mesmo vencimento. Ele aparece como Parcial, com o restante, até o total atingir o valor previsto.",
"faq.overpay.q":"Posso pagar a mais?",
"faq.overpay.a":"Sim. O vencimento aparece como Paga, o restante fica em 0 e o excedente é exibido como Pago a mais em todo o app.",
"faq.overdue.q":"Como funciona o status Atrasada?",
"faq.overdue.a":"Um vencimento fica Atrasado quando a data já passou e nada foi pago. Se depois for pago integralmente, aparece como Paga, com uma observação de que foi pago com atraso.",
"faq.archive.q":"O que acontece quando arquivo uma conta?",
"faq.archive.a":"Ela deixa de gerar vencimentos a partir da data de arquivamento, mas os vencimentos e pagamentos anteriores continuam no Acompanhamento Anual e nos Relatórios. Você pode restaurá-la quando quiser.",
"faq.export.q":"Posso exportar meus dados?",
"faq.export.a":"Sim. Exporte um backup JSON completo ou arquivos CSV de contas, pagamentos e vencimentos em Configurações › Gerenciamento de Dados. Os relatórios também têm Exportar CSV.",
"faq.restore.q":"Posso restaurar um backup?",
"faq.restore.a":"Sim. Escolha o arquivo de backup em Configurações › Gerenciamento de Dados. Ele é validado antes de substituir qualquer coisa e você precisa confirmar.",
"faq.autopay.q":"O débito automático marca as contas como pagas?",
"faq.autopay.a":"Não. O débito automático é um lembrete de que a conta é paga automaticamente pelo banco ou fornecedor. O status só muda quando você registra o pagamento.",
"faq.currency.q":"Como mudo a moeda?",
"faq.currency.a":"Abra Configurações › Moeda e Formatos (ou Perfil) e escolha uma moeda. Os valores passam a ser exibidos na nova moeda; não há conversão.",
"faq.startFresh.q":"Como começo do zero?",
"faq.startFresh.a":"Use Começar do Zero em Configurações › Gerenciamento de Dados. Um backup é baixado primeiro e depois todas as contas e pagamentos são removidos.",
/* ---------- Privacy ---------- */
"privacy.title":"Política de Privacidade",
"privacy.intro":"Esta política explica como o Bill Payment Tracker, da Yusuf Design Co., trata as informações que você insere.",
"privacy.s1.title":"Seus dados ficam no seu dispositivo",
"privacy.s1.body":"Contas, pagamentos, categorias, formas de pagamento, dados do perfil e configurações são armazenados no armazenamento local do navegador do dispositivo que você usa. O app não os envia para lugar nenhum.",
"privacy.s2.title":"Sem servidor, banco de dados ou conta",
"privacy.s2.body":"O app funciona inteiramente no seu navegador. Não exige conta, não usa servidor nem banco de dados e não chama APIs externas.",
"privacy.s3.title":"Sem rastreamento",
"privacy.s3.body":"O app não inclui análises, publicidade nem scripts de rastreamento, e não carrega fontes ou bibliotecas externas.",
"privacy.s4.title":"Você controla seus backups",
"privacy.s4.body":"Backups e exportações CSV só são criados quando você decide exportá-los. Onde guardar esses arquivos e quem pode acessá-los depende de você.",
"privacy.s5.title":"Limpar o armazenamento do navegador",
"privacy.s5.body":"Limpar os dados do navegador, usar o modo privado ou anônimo, desinstalar o navegador ou redefinir o dispositivo pode apagar seus dados. Exporte backups regularmente.",
"privacy.s6.title":"Proteja os arquivos exportados",
"privacy.s6.body":"Os arquivos exportados contêm seus registros financeiros em formato legível. Guarde-os com segurança e compartilhe apenas com pessoas de confiança.",
"privacy.s7.title":"Dúvidas",
"privacy.s7.body":"Como o app nunca recebe seus dados, você mesmo pode atender qualquer solicitação sobre seus registros: visualize, edite, exporte ou exclua-os a qualquer momento no app.",
/* ---------- Terms ---------- */
"terms.title":"Termos de Uso",
"terms.intro":"Ao usar o Bill Payment Tracker, você concorda com estes termos.",
"terms.s1.title":"Finalidade",
"terms.s1.body":"O Bill Payment Tracker é uma ferramenta de organização pessoal para registrar contas, vencimentos e pagamentos.",
"terms.s2.title":"Uso pessoal",
"terms.s2.body":"O app destina-se ao controle doméstico e pessoal. Não é um serviço bancário, de pagamentos ou de contabilidade e não pode efetuar pagamentos.",
"terms.s3.title":"Seus dados, sua responsabilidade",
"terms.s3.body":"Você é responsável pelas informações que insere e por manter seu dispositivo e navegador seguros.",
"terms.s4.title":"Backups",
"terms.s4.body":"Os dados ficam apenas no seu navegador. Você é responsável por exportar e guardar backups com segurança; a Yusuf Design Co. não pode recuperar dados perdidos do navegador.",
"terms.s5.title":"Sem garantia de exatidão financeira",
"terms.s5.body":"Totais, status e relatórios são calculados a partir dos dados que você insere. O app é fornecido no estado em que se encontra, sem garantia de que os resultados sejam completos ou exatos.",
"terms.s6.title":"Não é aconselhamento profissional",
"terms.s6.body":"Nada no app constitui aconselhamento financeiro, fiscal, jurídico ou profissional. Confirme valores e prazos importantes com seus fornecedores.",
"terms.s7.title":"Registro correto dos dados",
"terms.s7.body":"Lembretes, alertas de atraso e relatórios dependem de valores e datas corretos. Revise seus lançamentos e registre os pagamentos em dia.",
"terms.s8.title":"Alterações",
"terms.s8.body":"Versões futuras do app podem atualizar estes termos. Continuar usando uma versão atualizada significa aceitar os termos dela.",

"guide.pageTitle":"Guide de l'Utilisateur",
"guide.intro":"Une aide pas à pas pour chaque partie de Bill Payment Tracker.",
"help.tabsAria":"Pages d'aide",

"ug.gettingStarted.title":"Premiers Pas",
"ug.gettingStarted.intro":"Bill Payment Tracker rassemble toutes vos factures, échéances et paiements au même endroit, entièrement sur votre appareil.",
"ug.gettingStarted.steps":"Ouvrez Profil (en haut à droite) et saisissez votre nom.|Dans Paramètres, choisissez votre devise, votre format de date et le premier jour de la semaine.|Ajoutez votre première facture, ou choisissez Charger des Données d'Exemple dans Paramètres pour découvrir l'app.|Utilisez le menu pour passer du Tableau de Bord aux Factures, au Calendrier, aux Paiements, au Suivi Annuel et aux Rapports.",
"ug.addBill.title":"Ajouter une Facture",
"ug.addBill.intro":"Une facture décrit une dépense que vous payez une fois ou selon un calendrier.",
"ug.addBill.steps":"Cliquez sur Ajouter une Facture dans la page Factures (ou dans le Tableau de Bord ou le Calendrier).|Saisissez le nom, choisissez une catégorie et indiquez si elle est Fixe ou Variable.|Saisissez le montant prévu, la fréquence et la première échéance.|Ajoutez si besoin un moyen de paiement, le paiement automatique et des notes, puis cliquez sur Ajouter une Facture.",
"ug.recurring.title":"Factures Récurrentes",
"ug.recurring.intro":"Une facture récurrente crée une échéance distincte pour chaque période. Chaque échéance a son propre montant prévu, ses paiements et son statut.",
"ug.recurring.steps":"Choisissez Hebdomadaire, Toutes les 2 semaines, Mensuelle, Trimestrielle, Semestrielle ou Annuelle.|Les échéances se répètent à partir de la première échéance selon la fréquence.|Si le jour n'existe pas dans un mois (par exemple le 31), le dernier jour de ce mois est utilisé.|Payer une échéance ne modifie jamais les autres.",
"ug.fixedVariable.title":"Factures Fixes et Variables",
"ug.fixedVariable.intro":"Les factures fixes prévoient toujours le même montant. Les factures variables, comme l'électricité, peuvent prévoir un montant différent à chaque échéance.",
"ug.fixedVariable.steps":"Choisissez Variable lors de l'ajout et saisissez une estimation habituelle.|Ouvrez une échéance depuis le Calendrier, le Suivi Annuel ou le détail de la facture.|Cliquez sur Modifier le montant prévu et saisissez le montant réel de la période.|Rétablir par défaut remet l'estimation pour cette seule échéance.",
"ug.payments.title":"Enregistrer des Paiements",
"ug.payments.intro":"Les paiements sont des enregistrements distincts liés à une facture et à une échéance précise.",
"ug.payments.steps":"Cliquez sur Payer à côté d'une facture ou dans le calendrier, ou sur Enregistrer un Paiement dans la page Paiements.|Choisissez la facture et l'échéance concernée.|Saisissez la date, le montant et le moyen de paiement, puis cliquez sur Enregistrer un Paiement.|Toutes les pages — Tableau de Bord, Calendrier, Suivi Annuel et Rapports — se mettent à jour immédiatement.",
"ug.partial.title":"Paiements Partiels et Trop-perçus",
"ug.partial.intro":"Une échéance peut recevoir autant de paiements que nécessaire.",
"ug.partial.steps":"Si le total payé est inférieur au prévu, le statut est Partielle et le restant est affiché.|Enregistrez un autre paiement pour la même échéance afin de la solder ; le statut devient Payée.|Si vous payez plus que prévu, le statut est Payée et l'excédent apparaît en Trop-perçu.|Modifiez ou supprimez un paiement depuis la page Paiements ou le détail de la facture.",
"ug.calendar.title":"Calendrier",
"ug.calendar.intro":"Le Calendrier affiche chaque échéance du mois avec son montant et son statut.",
"ug.calendar.steps":"Utilisez les flèches pour changer de mois, ou Aujourd'hui pour revenir.|Cliquez sur une entrée pour voir son détail et ses paiements ; utilisez Payer pour enregistrer un paiement.|Si un jour compte de nombreuses factures, cliquez sur « + de plus » pour toutes les voir.|Sur téléphone, touchez le nombre affiché sur un jour, ou utilisez la liste sous le calendrier.",
"ug.yearly.title":"Suivi Annuel",
"ug.yearly.intro":"Le Suivi Annuel affiche chaque facture sur les douze mois d'une année.",
"ug.yearly.steps":"Choisissez une année avec les flèches ou le sélecteur.|Filtrez par catégorie ou par facture si besoin.|Chaque case montre le statut du mois ; les factures à plusieurs échéances affichent payées/total.|Cliquez sur une case pour ouvrir l'échéance. Sur petit écran, faites défiler horizontalement.",
"ug.dashboard.title":"Tableau de Bord",
"ug.dashboard.intro":"Le Tableau de Bord résume vos factures sur la période choisie.",
"ug.dashboard.steps":"Choisissez une période (Ce Mois par défaut) pour mettre à jour Total Dû, Total Payé et Restant.|En Retard inclut toujours toutes les échéances passées impayées ; Bientôt Dû utilise la fenêtre définie dans Paramètres.|Les graphiques montrent la progression, le prévu vs payé, les dépenses par catégorie et la tendance mensuelle.|Prochaines Factures et Paiements Récents donnent un accès rapide à l'essentiel.",
"ug.reports.title":"Rapports",
"ug.reports.intro":"Les rapports analysent le prévu, le payé, le restant et les retards.",
"ug.reports.steps":"Choisissez un rapport : Synthèse Mensuelle ou Annuelle, Dépenses par Catégorie, Payé vs En Attente, Analyse des Retards, Tendance Mensuelle, Prévu vs Payé ou Moyens de Paiement.|Utilisez le sélecteur d'année ou de période et les filtres de catégorie et de facture.|Cliquez sur Exporter en CSV pour télécharger le tableau du rapport.",
"ug.categories.title":"Catégories",
"ug.categories.intro":"Les catégories regroupent les factures pour les filtres et les rapports.",
"ug.categories.steps":"Allez dans Paramètres › Catégories.|Saisissez un nom et cliquez sur Ajouter, ou sur Renommer pour le modifier.|Archivez une catégorie inutilisée ; les factures existantes la conservent et l'historique reste intact.|Restaurez-la à tout moment depuis la liste des archivées.",
"ug.methods.title":"Moyens de Paiement",
"ug.methods.intro":"Les moyens de paiement indiquent comment chaque paiement a été réglé.",
"ug.methods.steps":"Allez dans Paramètres › Moyens de Paiement.|Ajoutez, renommez, archivez ou restaurez des moyens.|Les moyens archivés restent sur les paiements passés et dans les rapports.",
"ug.backup.title":"Sauvegarde",
"ug.backup.intro":"Les données n'étant stockées que dans ce navigateur, des sauvegardes régulières vous protègent.",
"ug.backup.steps":"Allez dans Paramètres › Gestion des Données.|Cliquez sur Exporter une Sauvegarde JSON.|Conservez le fichier téléchargé en lieu sûr, par exemple dans un dossier cloud privé ou sur une clé USB.",
"ug.restore.title":"Restauration",
"ug.restore.intro":"Une sauvegarde peut être restaurée sur cet appareil ou un autre.",
"ug.restore.steps":"Allez dans Paramètres › Gestion des Données et cliquez sur Choisir un fichier de sauvegarde.|Sélectionnez une sauvegarde JSON de Bill Payment Tracker.|Le fichier est d'abord vérifié ; s'il est valide, confirmez pour remplacer vos données actuelles.",
"ug.demo.title":"Données d'Exemple",
"ug.demo.intro":"Les données d'exemple permettent de découvrir l'app avec des cas réalistes. Elles ne sont jamais chargées automatiquement.",
"ug.demo.steps":"Cliquez sur Charger des Données d'Exemple dans le Tableau de Bord ou dans Paramètres.|Si vous avez déjà des données, une sauvegarde est téléchargée avant leur remplacement.|Utilisez Repartir de Zéro quand vous êtes prêt à saisir vos propres factures.",
"ug.startFresh.title":"Repartir de Zéro",
"ug.startFresh.intro":"Repartir de Zéro efface toutes les factures et tous les paiements.",
"ug.startFresh.steps":"Allez dans Paramètres › Gestion des Données et cliquez sur Repartir de Zéro.|Confirmez ; une sauvegarde JSON est d'abord téléchargée.|Factures et paiements sont supprimés, catégories et moyens réinitialisés. Profil, langue et réglages sont conservés.",
"ug.offline.title":"Stockage Hors Ligne",
"ug.offline.intro":"L'app est un fichier unique qui fonctionne sans Internet.",
"ug.offline.steps":"Vos données sont enregistrées automatiquement dans le stockage local de ce navigateur.|Rien n'est envoyé à un serveur ; aucun compte n'est nécessaire.|Effacer les données du navigateur ou utiliser la navigation privée peut les supprimer — exportez des sauvegardes.",
"ug.languages.title":"Langues",
"ug.languages.intro":"L'interface est disponible en anglais, espagnol, portugais, français et allemand.",
"ug.languages.steps":"Choisissez une langue dans le sélecteur en haut de la page ou dans Paramètres.|Votre choix est mémorisé sur cet appareil.|Changer de langue ne modifie jamais vos données.",
"ug.currency.title":"Devise",
"ug.currency.intro":"Tous les montants utilisent la devise que vous choisissez.",
"ug.currency.steps":"Allez dans Paramètres › Devise et Formats, ou ouvrez Profil.|Choisissez votre devise ; toutes les pages, graphiques et exports se mettent à jour.|Changer de devise modifie l'affichage des montants ; les valeurs ne sont pas converties.",
"faq.intro":"Réponses aux questions fréquentes sur Bill Payment Tracker.",
"faq.storedOnline.q":"Mes données sont-elles stockées en ligne ?",
"faq.storedOnline.a":"Non. Tout est stocké localement dans ce navigateur, sur cet appareil. L'app n'utilise ni serveur, ni base de données, ni API externe.",
"faq.offline.q":"L'app fonctionne-t-elle hors ligne ?",
"faq.offline.a":"Oui. C'est un fichier HTML autonome avec ses polices intégrées ; il fonctionne sans connexion Internet.",
"faq.recurring.q":"Comment les factures récurrentes sont-elles gérées ?",
"faq.recurring.a":"Une facture récurrente est un calendrier. Chaque échéance est suivie séparément avec son montant prévu, ses paiements et son statut : payer septembre n'affecte jamais octobre.",
"faq.partial.q":"Puis-je effectuer des paiements partiels ?",
"faq.partial.a":"Oui. Enregistrez autant de paiements que nécessaire pour la même échéance. Elle reste Partielle, avec le restant affiché, jusqu'à ce que le total atteigne le montant prévu.",
"faq.overpay.q":"Puis-je payer plus que prévu ?",
"faq.overpay.a":"Oui. L'échéance s'affiche Payée, le restant passe à 0 et l'excédent apparaît partout en Trop-perçu.",
"faq.overdue.q":"Comment fonctionne le statut En Retard ?",
"faq.overdue.a":"Une échéance est En Retard lorsque sa date est passée et que rien n'a été payé. Si elle est ensuite entièrement réglée, elle s'affiche Payée avec une mention de paiement en retard.",
"faq.archive.q":"Que se passe-t-il quand j'archive une facture ?",
"faq.archive.a":"Elle cesse de créer des échéances à partir de la date d'archivage, mais ses échéances et paiements passés restent dans le Suivi Annuel et les Rapports. Vous pouvez la restaurer à tout moment.",
"faq.export.q":"Puis-je exporter mes données ?",
"faq.export.a":"Oui. Exportez une sauvegarde JSON complète ou des fichiers CSV des factures, paiements et échéances depuis Paramètres › Gestion des Données. Les rapports proposent aussi Exporter en CSV.",
"faq.restore.q":"Puis-je restaurer une sauvegarde ?",
"faq.restore.a":"Oui. Choisissez le fichier de sauvegarde dans Paramètres › Gestion des Données. Il est validé avant tout remplacement et une confirmation vous est demandée.",
"faq.autopay.q":"Le paiement automatique marque-t-il les factures comme payées ?",
"faq.autopay.a":"Non. Le paiement automatique rappelle que la facture est réglée automatiquement par votre banque ou fournisseur. Le statut ne change que lorsque vous enregistrez le paiement.",
"faq.currency.q":"Comment changer de devise ?",
"faq.currency.a":"Ouvrez Paramètres › Devise et Formats (ou Profil) et choisissez une devise. Les montants s'affichent dans la nouvelle devise ; les valeurs ne sont pas converties.",
"faq.startFresh.q":"Comment repartir de zéro ?",
"faq.startFresh.a":"Utilisez Repartir de Zéro dans Paramètres › Gestion des Données. Une sauvegarde est d'abord téléchargée, puis toutes les factures et tous les paiements sont supprimés.",
/* ---------- Privacy ---------- */
"privacy.title":"Politique de Confidentialité",
"privacy.intro":"Cette politique explique comment Bill Payment Tracker de Yusuf Design Co. traite les informations que vous saisissez.",
"privacy.s1.title":"Vos données restent sur votre appareil",
"privacy.s1.body":"Les factures, paiements, catégories, moyens de paiement, informations de profil et réglages sont stockés dans le stockage local du navigateur de l'appareil que vous utilisez. L'app ne les envoie nulle part.",
"privacy.s2.title":"Ni serveur, ni base de données, ni compte",
"privacy.s2.body":"L'app fonctionne entièrement dans votre navigateur. Elle ne nécessite pas de compte, n'utilise ni serveur ni base de données et n'appelle aucune API externe.",
"privacy.s3.title":"Aucun pistage",
"privacy.s3.body":"L'app ne contient ni outil d'analyse, ni publicité, ni script de pistage, et ne charge aucune police ou bibliothèque externe.",
"privacy.s4.title":"Vous maîtrisez vos sauvegardes",
"privacy.s4.body":"Les sauvegardes et exports CSV ne sont créés que lorsque vous choisissez de les exporter. Vous décidez où stocker ces fichiers et qui peut y accéder.",
"privacy.s5.title":"Effacement du stockage du navigateur",
"privacy.s5.body":"Effacer les données du navigateur, utiliser la navigation privée, désinstaller le navigateur ou réinitialiser l'appareil peut supprimer vos données. Exportez régulièrement des sauvegardes.",
"privacy.s6.title":"Protégez les fichiers exportés",
"privacy.s6.body":"Les fichiers exportés contiennent vos données financières sous forme lisible. Conservez-les en sécurité et ne les partagez qu'avec des personnes de confiance.",
"privacy.s7.title":"Questions",
"privacy.s7.body":"L'app ne recevant jamais vos données, vous pouvez traiter vous-même toute demande concernant vos enregistrements : consultez-les, modifiez-les, exportez-les ou supprimez-les à tout moment dans l'app.",
/* ---------- Terms ---------- */
"terms.title":"Conditions d'Utilisation",
"terms.intro":"En utilisant Bill Payment Tracker, vous acceptez les présentes conditions.",
"terms.s1.title":"Objet",
"terms.s1.body":"Bill Payment Tracker est un outil d'organisation personnelle permettant d'enregistrer des factures, des échéances et des paiements.",
"terms.s2.title":"Usage personnel",
"terms.s2.body":"L'app est destinée à la gestion personnelle et familiale. Ce n'est pas un service bancaire, de paiement ou de comptabilité, et elle ne peut effectuer aucun paiement.",
"terms.s3.title":"Vos données, votre responsabilité",
"terms.s3.body":"Vous êtes responsable des informations que vous saisissez et de la sécurité de votre appareil et de votre navigateur.",
"terms.s4.title":"Sauvegardes",
"terms.s4.body":"Les données ne sont stockées que dans votre navigateur. Il vous appartient d'exporter et de conserver des sauvegardes ; Yusuf Design Co. ne peut pas récupérer des données perdues dans le navigateur.",
"terms.s5.title":"Aucune garantie d'exactitude financière",
"terms.s5.body":"Les totaux, statuts et rapports sont calculés à partir des données que vous saisissez. L'app est fournie en l'état, sans garantie que les résultats soient complets ou exacts.",
"terms.s6.title":"Pas un conseil professionnel",
"terms.s6.body":"Rien dans l'app ne constitue un conseil financier, fiscal, juridique ou professionnel. Vérifiez les montants et échéances importants auprès de vos fournisseurs.",
"terms.s7.title":"Saisie correcte des données",
"terms.s7.body":"Les rappels, alertes de retard et rapports dépendent de montants et de dates exacts. Vérifiez vos saisies et enregistrez vos paiements sans tarder.",
"terms.s8.title":"Modifications",
"terms.s8.body":"Les versions futures de l'app peuvent mettre à jour ces conditions. Continuer à utiliser une version mise à jour vaut acceptation de ses conditions.",

/* ---------- Help ---------- */
"guide.pageTitle":"Benutzerhandbuch",
"guide.intro":"Schritt-für-Schritt-Hilfe zu jedem Bereich von Bill Payment Tracker.",
"help.tabsAria":"Hilfeseiten",
"help.expandAll":"Alle aufklappen",
"help.collapseAll":"Alle zuklappen",
"ug.gettingStarted.title":"Erste Schritte",
"ug.gettingStarted.intro":"Bill Payment Tracker bündelt alle Rechnungen, Fälligkeiten und Zahlungen an einem Ort — vollständig auf Ihrem Gerät.",
"ug.gettingStarted.steps":"Öffnen Sie Profil (oben rechts) und geben Sie Ihren Namen ein.|Wählen Sie in den Einstellungen Währung, Datumsformat und den ersten Wochentag.|Fügen Sie Ihre erste Rechnung hinzu oder wählen Sie in den Einstellungen Beispieldaten Laden.|Wechseln Sie über das Menü zwischen Übersicht, Rechnungen, Kalender, Zahlungen, Jahresübersicht und Berichten.",
"ug.addBill.title":"Eine Rechnung Hinzufügen",
"ug.addBill.intro":"Eine Rechnung beschreibt etwas, das Sie einmalig oder regelmäßig bezahlen.",
"ug.addBill.steps":"Klicken Sie auf der Seite Rechnungen (oder in der Übersicht bzw. im Kalender) auf Rechnung Hinzufügen.|Geben Sie den Namen ein, wählen Sie eine Kategorie und ob die Rechnung Fest oder Variabel ist.|Geben Sie den erwarteten Betrag, den Rhythmus und die erste Fälligkeit ein.|Ergänzen Sie optional Zahlungsart, automatische Zahlung und Notizen und klicken Sie auf Rechnung Hinzufügen.",
"ug.recurring.title":"Wiederkehrende Rechnungen",
"ug.recurring.intro":"Eine wiederkehrende Rechnung erzeugt für jeden Zeitraum eine eigene Fälligkeit. Jede Fälligkeit hat ihren eigenen erwarteten Betrag, ihre Zahlungen und ihren Status.",
"ug.recurring.steps":"Wählen Sie Wöchentlich, Zweiwöchentlich, Monatlich, Vierteljährlich, Halbjährlich oder Jährlich.|Die Fälligkeiten wiederholen sich ab der ersten Fälligkeit entsprechend dem Rhythmus.|Gibt es den Tag in einem Monat nicht (z. B. den 31.), wird der letzte Tag dieses Monats verwendet.|Das Bezahlen einer Fälligkeit ändert niemals eine andere.",
"ug.fixedVariable.title":"Feste und Variable Rechnungen",
"ug.fixedVariable.intro":"Feste Rechnungen erwarten immer denselben Betrag. Variable Rechnungen wie Strom können für jede Fälligkeit einen anderen Betrag erwarten.",
"ug.fixedVariable.steps":"Wählen Sie beim Hinzufügen Variabel und geben Sie einen üblichen Schätzwert ein.|Öffnen Sie eine Fälligkeit im Kalender, in der Jahresübersicht oder in den Rechnungsdetails.|Klicken Sie auf Erwarteten Betrag bearbeiten und geben Sie den tatsächlichen Betrag dieses Zeitraums ein.|Auf Standard zurücksetzen stellt die Schätzung nur für diese Fälligkeit wieder her.",
"ug.payments.title":"Zahlungen Erfassen",
"ug.payments.intro":"Zahlungen sind eigene Einträge, die mit einer Rechnung und genau einer Fälligkeit verknüpft sind.",
"ug.payments.steps":"Klicken Sie neben einer Rechnung oder im Kalender auf Bezahlen oder auf der Seite Zahlungen auf Zahlung Erfassen.|Wählen Sie die Rechnung und die Fälligkeit, zu der die Zahlung gehört.|Geben Sie Zahlungsdatum, Betrag und Zahlungsart ein und klicken Sie auf Zahlung Erfassen.|Alle Seiten — Übersicht, Kalender, Jahresübersicht und Berichte — werden sofort aktualisiert.",
"ug.partial.title":"Teil- und Überzahlungen",
"ug.partial.intro":"Eine Fälligkeit kann beliebig viele Zahlungen erhalten.",
"ug.partial.steps":"Ist die bezahlte Summe kleiner als erwartet, lautet der Status Teilweise und der offene Betrag wird angezeigt.|Erfassen Sie eine weitere Zahlung für dieselbe Fälligkeit, um sie abzuschließen; der Status wird Bezahlt.|Zahlen Sie mehr als erwartet, lautet der Status Bezahlt und der Mehrbetrag erscheint als Überzahlt.|Bearbeiten oder löschen Sie Zahlungen auf der Seite Zahlungen oder in den Rechnungsdetails.",
"ug.calendar.title":"Kalender",
"ug.calendar.intro":"Der Kalender zeigt jede Fälligkeit des Monats mit Betrag und Status.",
"ug.calendar.steps":"Wechseln Sie mit den Pfeilen den Monat oder kehren Sie mit Heute zurück.|Klicken Sie auf einen Eintrag, um Details und Zahlungen zu sehen; mit Bezahlen erfassen Sie eine Zahlung.|Hat ein Tag viele Rechnungen, klicken Sie auf „+ weitere“, um alle zu sehen.|Tippen Sie auf dem Handy auf die Zahl eines Tages oder nutzen Sie die Liste unter dem Kalender.",
"ug.yearly.title":"Jahresübersicht",
"ug.yearly.intro":"Die Jahresübersicht zeigt jede Rechnung über alle zwölf Monate eines Jahres.",
"ug.yearly.steps":"Wählen Sie ein Jahr mit den Pfeilen oder der Jahresauswahl.|Filtern Sie bei Bedarf nach Kategorie oder Rechnung.|Jede Zelle zeigt den Status des Monats; Rechnungen mit mehreren Fälligkeiten zeigen bezahlt/gesamt.|Klicken Sie auf eine Zelle, um die Fälligkeit zu öffnen. Auf kleinen Bildschirmen seitlich scrollen.",
"ug.dashboard.title":"Übersicht",
"ug.dashboard.intro":"Die Übersicht fasst Ihre Rechnungen für den gewählten Zeitraum zusammen.",
"ug.dashboard.steps":"Wählen Sie einen Zeitraum (standardmäßig Dieser Monat), um Gesamt Fällig, Gesamt Bezahlt und Offen zu aktualisieren.|Überfällig umfasst immer alle unbezahlten vergangenen Fälligkeiten; Bald Fällig nutzt das Zeitfenster aus den Einstellungen.|Diagramme zeigen den Zahlungsfortschritt, erwartet vs bezahlt, Ausgaben nach Kategorie und den Monatstrend.|Anstehende Rechnungen und Letzte Zahlungen bieten schnellen Zugriff auf das Wichtigste.",
"ug.reports.title":"Berichte",
"ug.reports.intro":"Berichte analysieren, was erwartet, bezahlt, offen und überfällig ist.",
"ug.reports.steps":"Wählen Sie einen Bericht: Monats- oder Jahresübersicht, Ausgaben nach Kategorie, Bezahlt vs Offen, Rückstandsanalyse, Monatstrend, Erwartet vs Bezahlt oder Zahlungsarten.|Nutzen Sie die Jahres- oder Zeitraumauswahl sowie die Kategorie- und Rechnungsfilter.|Klicken Sie auf CSV Exportieren, um die Berichtstabelle herunterzuladen.",
"ug.categories.title":"Kategorien",
"ug.categories.intro":"Kategorien gruppieren Rechnungen für Filter und Berichte.",
"ug.categories.steps":"Öffnen Sie Einstellungen › Kategorien.|Geben Sie einen Namen ein und klicken Sie auf Hinzufügen oder auf Umbenennen, um ihn zu ändern.|Archivieren Sie eine nicht mehr genutzte Kategorie; bestehende Rechnungen behalten sie und der Verlauf bleibt erhalten.|Stellen Sie sie jederzeit über die Archivliste wieder her.",
"ug.methods.title":"Zahlungsarten",
"ug.methods.intro":"Zahlungsarten halten fest, wie jede Zahlung erfolgt ist.",
"ug.methods.steps":"Öffnen Sie Einstellungen › Zahlungsarten.|Fügen Sie Zahlungsarten hinzu, benennen Sie sie um, archivieren oder stellen Sie sie wieder her.|Archivierte Zahlungsarten bleiben bei früheren Zahlungen und in Berichten erhalten.",
"ug.backup.title":"Sicherung",
"ug.backup.intro":"Da die Daten nur in diesem Browser gespeichert sind, schützen regelmäßige Sicherungen Sie.",
"ug.backup.steps":"Öffnen Sie Einstellungen › Datenverwaltung.|Klicken Sie auf JSON-Sicherung Exportieren.|Bewahren Sie die heruntergeladene Datei sicher auf, z. B. in einem privaten Cloud-Ordner oder auf einem USB-Stick.",
"ug.restore.title":"Wiederherstellen",
"ug.restore.intro":"Eine Sicherung kann auf diesem oder einem anderen Gerät wiederhergestellt werden.",
"ug.restore.steps":"Öffnen Sie Einstellungen › Datenverwaltung und klicken Sie auf Sicherungsdatei auswählen.|Wählen Sie eine JSON-Sicherung von Bill Payment Tracker.|Die Datei wird zuerst geprüft; ist sie gültig, bestätigen Sie das Ersetzen Ihrer aktuellen Daten.",
"ug.demo.title":"Beispieldaten",
"ug.demo.intro":"Mit Beispieldaten können Sie die App anhand realistischer Fälle erkunden. Sie werden nie automatisch geladen.",
"ug.demo.steps":"Klicken Sie in der Übersicht oder in den Einstellungen auf Beispieldaten Laden.|Haben Sie bereits Daten, wird vor dem Ersetzen eine Sicherung heruntergeladen.|Nutzen Sie Neu Beginnen, wenn Sie Ihre eigenen Rechnungen erfassen möchten.",
"ug.startFresh.title":"Neu Beginnen",
"ug.startFresh.intro":"Neu Beginnen löscht alle Rechnungen und Zahlungen.",
"ug.startFresh.steps":"Öffnen Sie Einstellungen › Datenverwaltung und klicken Sie auf Neu Beginnen.|Bestätigen Sie; zuerst wird eine JSON-Sicherung heruntergeladen.|Rechnungen und Zahlungen werden entfernt, Kategorien und Zahlungsarten zurückgesetzt. Profil, Sprache und Einstellungen bleiben erhalten.",
"ug.offline.title":"Offline-Speicherung",
"ug.offline.intro":"Die App ist eine einzelne Datei, die ohne Internet funktioniert.",
"ug.offline.steps":"Ihre Daten werden automatisch im lokalen Speicher dieses Browsers gespeichert.|Nichts wird an einen Server gesendet; ein Konto ist nicht nötig.|Das Löschen von Browserdaten oder privates Surfen kann die Daten entfernen — exportieren Sie Sicherungen.",
"ug.languages.title":"Sprachen",
"ug.languages.intro":"Die Oberfläche ist auf Englisch, Spanisch, Portugiesisch, Französisch und Deutsch verfügbar.",
"ug.languages.steps":"Wählen Sie eine Sprache in der Auswahl oben auf der Seite oder in den Einstellungen.|Ihre Auswahl wird auf diesem Gerät gespeichert.|Ein Sprachwechsel ändert niemals Ihre Daten.",
"ug.currency.title":"Währung",
"ug.currency.intro":"Alle Beträge verwenden die von Ihnen gewählte Währung.",
"ug.currency.steps":"Öffnen Sie Einstellungen › Währung & Formate oder das Profil.|Wählen Sie Ihre Währung; alle Seiten, Diagramme und Exporte werden aktualisiert.|Ein Währungswechsel ändert nur die Anzeige der Beträge; Werte werden nicht umgerechnet.",
"faq.intro":"Antworten auf häufige Fragen zu Bill Payment Tracker.",
"faq.storedOnline.q":"Werden meine Daten online gespeichert?",
"faq.storedOnline.a":"Nein. Alles wird lokal in diesem Browser auf diesem Gerät gespeichert. Die App nutzt keinen Server, keine Datenbank und keine externen APIs.",
"faq.offline.q":"Funktioniert die App offline?",
"faq.offline.a":"Ja. Sie ist eine eigenständige HTML-Datei mit eingebetteten Schriften und funktioniert ohne Internetverbindung.",
"faq.recurring.q":"Wie werden wiederkehrende Rechnungen behandelt?",
"faq.recurring.a":"Eine wiederkehrende Rechnung ist ein Zeitplan. Jede Fälligkeit wird separat mit eigenem erwarteten Betrag, eigenen Zahlungen und eigenem Status geführt — eine Zahlung für September beeinflusst nie den Oktober.",
"faq.partial.q":"Kann ich Teilzahlungen leisten?",
"faq.partial.a":"Ja. Erfassen Sie für dieselbe Fälligkeit beliebig viele Zahlungen. Sie wird als Teilweise mit offenem Betrag angezeigt, bis die Summe den erwarteten Betrag erreicht.",
"faq.overpay.q":"Kann ich zu viel bezahlen?",
"faq.overpay.a":"Ja. Die Fälligkeit wird als Bezahlt angezeigt, der offene Betrag wird 0 und der Mehrbetrag erscheint überall als Überzahlt.",
"faq.overdue.q":"Wie funktioniert der Status Überfällig?",
"faq.overdue.a":"Eine Fälligkeit ist Überfällig, wenn ihr Datum vergangen ist und nichts bezahlt wurde. Wird sie später vollständig bezahlt, erscheint sie als Bezahlt mit dem Hinweis auf verspätete Zahlung.",
"faq.archive.q":"Was passiert, wenn ich eine Rechnung archiviere?",
"faq.archive.a":"Ab dem Archivierungsdatum entstehen keine neuen Fälligkeiten mehr, aber frühere Fälligkeiten und Zahlungen bleiben in der Jahresübersicht und in den Berichten. Sie können sie jederzeit wiederherstellen.",
"faq.export.q":"Kann ich meine Daten exportieren?",
"faq.export.a":"Ja. Exportieren Sie unter Einstellungen › Datenverwaltung eine vollständige JSON-Sicherung oder CSV-Dateien mit Rechnungen, Zahlungen und Fälligkeiten. Auch Berichte bieten CSV Exportieren.",

let CURRENT_LANG = 'en';
(function loadLang(){
  try{
    const saved = localStorage.getItem(LANG_STORAGE_KEY);
    if(saved && SUPPORTED_LANGS.indexOf(saved) !== -1) CURRENT_LANG = saved;
  }catch(e){ console.warn('localStorage unavailable for language preference', e); }
})();
function t(key, vars){
  const table = I18N[CURRENT_LANG] || I18N.en;
  let str = (table && table[key] !== undefined) ? table[key] : ((I18N.en && I18N.en[key] !== undefined) ? I18N.en[key] : key);
  if(vars){ Object.keys(vars).forEach(k=>{ str = str.split('{'+k+'}').join(vars[k]); }); }
  return str;
}
/* Simple one/other pluralization helper, kept for parity with the established i18n architecture. */
function tc(baseKey, n, vars){
  const suffix = (Number(n) === 1) ? '.one' : '.other';
  return t(baseKey + suffix, Object.assign({n:n}, vars||{}));
}
function currentLangLocale(){ return LANG_LOCALE[CURRENT_LANG] || 'en-US'; }
function setLanguage(lang){
  if(SUPPORTED_LANGS.indexOf(lang) === -1) return;
  CURRENT_LANG = lang;
  try{ localStorage.setItem(LANG_STORAGE_KEY, lang); }catch(e){ console.warn('Could not persist language preference', e); }
  document.documentElement.lang = lang;
  const sel = document.getElementById('lang-select');
  if(sel && sel.value !== lang) sel.value = lang;
  if(typeof SAVE_OK !== 'undefined') setSaveIndicator(SAVE_OK);
  if(typeof refreshStaticChromeText === 'function') refreshStaticChromeText();
  renderApp();
  toast(t('common.toastLanguageChanged'),'success');
}

/* ============================================================
   BILL PAYMENT TRACKER — CORE DATA LAYER
   ONE SOURCE OF TRUTH. Every current and future view (Dashboard,
   Bills, Calendar, Payments, Yearly Tracker, Reports) derives its
   figures from the records held in STORE.state. No view keeps its
   own copy of bill or payment information.

   Intended data flow (implemented in later phases):
     Bills -> Due Schedule -> Payments -> Monthly Totals -> Dashboard -> Reports
     Bill -> Due Date -> Expected Amount -> Actual Payment -> Remaining Balance -> Status

   STORAGE ISOLATION: this product persists ONLY under its own
   namespace (APP_STORAGE_KEY). It never reads or writes the retired
   Personal Budget Planner store ('pbp_data_v1'). The language
   preference (LANG_STORAGE_KEY) is shell infrastructure and is kept
   separately, exactly as in the YDC shell.
   ============================================================ */
const APP_STORAGE_KEY = 'ydc_bill_payment_calendar_v1';
const APP_ID = 'bill-payment-calendar';
const APP_SCHEMA_VERSION = 3;

/* ---------- ID / basic utils ---------- */
function uid(prefix){
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}
function localDateISO(d){
  const dt = d instanceof Date ? d : new Date(d);
  if(!(dt instanceof Date) || isNaN(dt.getTime())) return '';
  return [
    dt.getFullYear(),
    String(dt.getMonth() + 1).padStart(2, '0'),
    String(dt.getDate()).padStart(2, '0')
  ].join('-');
}
function todayISO(){ return localDateISO(new Date()); }
function nowISO(){ return new Date().toISOString(); }
function parseDateOnlyLocal(value){
  const v = String(value ?? '').trim();
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  if(!match) return null;
  const y = Number(match[1]), m = Number(match[2]), d = Number(match[3]);
  const dt = new Date(y, m - 1, d);
  if(dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return dt;
}
function calendarDayNumber(value){
  const dt = typeof value === 'string' ? parseDateOnlyLocal(value) : value;
  if(!(dt instanceof Date) || isNaN(dt.getTime())) return NaN;
  return Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate());
}
function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
function sum(arr, fn){ return arr.reduce((a,x)=> a + (fn ? (Number(fn(x))||0) : (Number(x)||0)), 0); }
function round2(n){ return Math.round((Number(n)||0) * 100) / 100; }
function safeNum(n, fallback){ const v = Number(n); return (isFinite(v) && !isNaN(v)) ? v : (fallback||0); }
function groupBy(arr, fn){
  const m = new Map();
  arr.forEach(x=>{ const k = fn(x); if(!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return m;
}
function escapeHtml(s){
  if(s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* Security boundary: use escapeHtml() whenever application/state data is
   interpolated into an HTML text node or attribute. Imported JSON is treated
   as untrusted state; validation happens before replacement and all rendered
   state values are escaped at the HTML sink. Never use user/state strings as
   executable markup, event-handler attributes, or script content. */
function debounce(fn, ms){
  let tmr = null;
  return function(...args){ clearTimeout(tmr); tmr = setTimeout(()=>fn.apply(this,args), ms); };
}
function bindSearchInput(el, selector, state, mountFn, delay=200){
  const input = el.querySelector(selector);
  if(!input) return;
  input.addEventListener('input', debounce(e=>{
    const searchInput = e.target;
    const hadFocus = document.activeElement === searchInput;
    const selectionStart = searchInput.selectionStart;
    const selectionEnd = searchInput.selectionEnd;
    state.q = searchInput.value;
    if(!searchInput.isConnected) return;
    mountFn(el);
    if(hadFocus){
      const restoredInput = el.querySelector(selector);
      if(restoredInput){
        restoredInput.focus({preventScroll:true});
        const caretStart = Math.min(selectionStart == null ? restoredInput.value.length : selectionStart, restoredInput.value.length);
        const caretEnd = Math.min(selectionEnd == null ? caretStart : selectionEnd, restoredInput.value.length);
        restoredInput.setSelectionRange(caretStart, caretEnd);
      }
    }
  }, delay));
}

/* ---------- Formatters (respect Settings) ---------- */
function currencySymbol(){ return currencySymbolFor(currencyCode()); }
/* All money is formatted with Intl.NumberFormat using the selected ISO currency. */
function fmtMoney(n){ return escapeHtml(formatMoneyText(n)); }
function fmtNum(n, decimals){
  const v = safeNum(n, 0);
  return v.toLocaleString(undefined, {minimumFractionDigits: decimals||0, maximumFractionDigits: decimals||0});
}
function fmtPct(n, decimals){
  const v = safeNum(n, 0);
  if(!isFinite(v)) return '—';
  return v.toFixed(decimals===undefined?1:decimals) + '%';
}
function fmtDate(isoDate){
  if(!isoDate) return '—';
  const fmt = (STORE.state.settings && STORE.state.settings.dateFormat) || 'MM/DD/YYYY';
  const parts = String(isoDate).slice(0,10).split('-');
  if(parts.length !== 3) return String(isoDate);
  const [y,m,d] = parts;
  if(fmt === 'DD/MM/YYYY') return `${d}/${m}/${y}`;
  if(fmt === 'YYYY-MM-DD') return `${y}-${m}-${d}`;
  return `${m}/${d}/${y}`;
}
function fmtDateTime(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso);
    return fmtDate(localDateISO(d)) + ' ' + d.toLocaleTimeString(currentLangLocale(),{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return String(iso); }
}
function monthKey(isoDate){ return String(isoDate).slice(0,7); } // YYYY-MM
function monthLabel(key){
  const [y,m] = String(key).split('-').map(Number);
  const d = new Date(y, (m||1)-1, 1);
  return d.toLocaleDateString(currentLangLocale(),{month:'long', year:'numeric'});
}
function monthAdd(key, delta){
  const [y,m] = String(key).split('-').map(Number);
  const d = new Date(y, (m-1)+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function currentMonthKey(){ return monthKey(todayISO()); }


/* ---------- Default state shape (single source of truth) ----------
   bills          — bill RULES (recurrence, expected amount, per-date overrides)
   payments       — independent payment records linked by billId + occurrenceDate
   categories     — bill categories (seeded defaults are translatable via `key`)
   paymentMethods — payment methods (seeded defaults are translatable via `key`)
   settings       — profile + formatting settings (currency, date format, week start)
   preferences    — UI/product preferences
   goals          — reserved collection kept for schema compatibility
   ------------------------------------------------------------------ */
const STATE_ARRAY_KEYS = ['bills','payments','categories','paymentMethods','goals'];
const STATE_OBJECT_KEYS = ['settings','preferences'];
const DATE_FORMATS = ['MM/DD/YYYY','DD/MM/YYYY','YYYY-MM-DD'];

function defaultSettings(){
  return {
    profileName: '',
    currencySymbol: '$',
    currencyCode: 'USD',
    dateFormat: 'MM/DD/YYYY',
    firstDayOfWeek: 0,            // 0=Sunday .. 6=Saturday
    dueSoonDays: 7
  };
}
function defaultState(){
  return {
    meta: { app: APP_ID, schemaVersion: APP_SCHEMA_VERSION, createdAt: todayISO(), lastSaved: null },
    bills: [],
    payments: [],
    categories: seedCategories(),
    paymentMethods: seedPaymentMethods(),
    settings: defaultSettings(),
    goals: [],
    preferences: {}
  };
}

/* ---------- Generic validation primitives (shell) ---------- */
function isPlainObject(v){
  if(v===null || typeof v!=='object') return false;
  const proto = Object.getPrototypeOf(v);
  return proto===Object.prototype || proto===null;
}
function hasDangerousKey(obj){
  if(!isPlainObject(obj)) return false;
  return Object.keys(obj).some(k=>k==='__proto__' || k==='constructor' || k==='prototype');
}
function isValidRecordId(v){
  return typeof v==='string' && v.trim()!=='' && v.length<=200 && !/[\u0000-\u001F\u007F]/.test(v);
}
function isValidStringField(v, maxLen){
  return typeof v==='string' && v.trim()!=='' && v.length<=maxLen && !/[\u0000-\u001F\u007F]/.test(v);
}
function isValidOptionalString(v, maxLen){
  return v===undefined || v===null || (typeof v==='string' && v.length<=maxLen && !/[\u0000-\u001F\u007F]/.test(v));
}
function isFiniteNumberValue(v){
  if(typeof v==='number') return Number.isFinite(v);
  if(typeof v==='string' && v.trim()!=='') return Number.isFinite(Number(v));
  return false;
}
function isValidNotesString(v, maxLen){
  return v===undefined || v===null || (typeof v==='string' && v.length<=maxLen && !/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(v));
}
function isValidBackupAmount(v, allowZero){
  if(!isFiniteNumberValue(v)) return false;
  const n = Number(v);
  return allowZero ? n>=0 : n>0;
}
function isValidMonthKey(v){
  if(typeof v!=='string' || !/^\d{4}-\d{2}$/.test(v)) return false;
  const parts=v.split('-').map(Number);
  return parts[1]>=1 && parts[1]<=12;
}
function isValidBackupTimestamp(v){
  if(v===undefined || v===null || v==='') return true;
  if(typeof v!=='string' || v.length>100) return false;
  const d=new Date(v);
  return Number.isFinite(d.getTime());
}
/* ============================================================
   STATE VALIDATION — used for stored data AND imported backups.
   Imported JSON is treated purely as data: it is parsed with
   JSON.parse, validated field-by-field, never executed.
   ============================================================ */
function validateStateShape(obj, opts){
  opts = opts || {};
  const errors = [];
  const fail = (key, vars)=>errors.push(t(key, vars));
  if(!isPlainObject(obj) || hasDangerousKey(obj)) return [t('backup.invalidData')];
  if(!isPlainObject(obj.meta) || hasDangerousKey(obj.meta)) return [t('backup.invalidMeta')];
  if(obj.meta.app !== APP_ID) return [t('backup.wrongApp')];
  const sv = Number(obj.meta.schemaVersion);
  if(!Number.isInteger(sv) || sv < 1) return [t('backup.invalidMeta')];
  if(sv > APP_SCHEMA_VERSION) return [t('backup.newerSchema', { v: sv })];
  STATE_OBJECT_KEYS.forEach(k=>{ if(obj[k] !== undefined && (!isPlainObject(obj[k]) || hasDangerousKey(obj[k]))) fail('backup.invalidSection', { k }); });
  STATE_ARRAY_KEYS.forEach(k=>{
    if(obj[k] === undefined){ if(opts.strict && k !== 'goals') fail('backup.missingList', { k }); }
    else if(!Array.isArray(obj[k])) fail('backup.invalidSection', { k });
  });
  if(errors.length) return errors;
  const s = obj.settings || {};
  if(s.currencyCode !== undefined && CURRENCY_CODES.indexOf(s.currencyCode) === -1) fail('backup.invalidSettings');
  if(s.dateFormat !== undefined && DATE_FORMATS.indexOf(s.dateFormat) === -1) fail('backup.invalidSettings');
  if(s.firstDayOfWeek !== undefined && !(Number.isInteger(Number(s.firstDayOfWeek)) && Number(s.firstDayOfWeek) >= 0 && Number(s.firstDayOfWeek) <= 6)) fail('backup.invalidSettings');
  if(s.profileName !== undefined && !isValidOptionalString(s.profileName, 200)) fail('backup.invalidSettings');
  const bad = (collection, index, reasonKey)=>fail('backup.invalidRecord', { collection: t('backup.collection.'+collection), index: index+1, reason: t('backup.reason.'+reasonKey) });
  const checkList = (key, fn)=>{
    const ids = new Set();
    (obj[key]||[]).forEach((r, i)=>{
      if(errors.length > 50) return;
      if(!isPlainObject(r) || hasDangerousKey(r)) return bad(key, i, 'recordObject');
      if(!isValidRecordId(r.id)) return bad(key, i, 'id');
      if(ids.has(r.id)) return bad(key, i, 'duplicateId');
      ids.add(r.id);
      fn(r, i);
    });
    return ids;
  };
  const listItem = key=>(r, i)=>{
    const named = typeof r.name === 'string' && r.name.trim() && r.name.length <= 60;
    const keyed = typeof r.key === 'string' && r.key.length <= 40 && /^[A-Za-z]+$/.test(r.key);
    if(!named && !keyed) return bad(key, i, 'name');
    if(r.archived !== undefined && typeof r.archived !== 'boolean') return bad(key, i, 'archived');
  };
  const catIds = checkList('categories', listItem('categories'));
  const pmIds = checkList('paymentMethods', listItem('paymentMethods'));
  const billIds = checkList('bills', (b, i)=>{
    if(!isValidStringField(b.name, MAX_NAME_LEN)) return bad('bills', i, 'name');
    if(!catIds.has(b.categoryId)) return bad('bills', i, 'category');
    if(BILL_TYPES.indexOf(b.billType) === -1) return bad('bills', i, 'type');
    if(!isFiniteNumberValue(b.amount) || Number(b.amount) < 0 || Number(b.amount) > MAX_AMOUNT) return bad('bills', i, 'amount');
    if(!BILL_FREQUENCIES[b.frequency]) return bad('bills', i, 'frequency');
    if(!isValidISODate(b.dueDate)) return bad('bills', i, 'date');
    if(b.paymentMethodId && !pmIds.has(b.paymentMethodId)) return bad('bills', i, 'paymentMethod');
    if(b.autoPay !== undefined && typeof b.autoPay !== 'boolean') return bad('bills', i, 'autoPay');
    if(b.archived !== undefined && typeof b.archived !== 'boolean') return bad('bills', i, 'archived');
    if(b.archivedAt && !isValidISODate(b.archivedAt)) return bad('bills', i, 'date');
    if(!isValidNotesString(b.notes, MAX_NOTES_LEN)) return bad('bills', i, 'notes');
    if(b.overrides !== undefined){
      if(!isPlainObject(b.overrides) || hasDangerousKey(b.overrides)) return bad('bills', i, 'overrides');
      for(const k of Object.keys(b.overrides)){ const v = b.overrides[k]; if(!isValidISODate(k) || !isFiniteNumberValue(v) || Number(v) < 0 || Number(v) > MAX_AMOUNT) return bad('bills', i, 'overrides'); }
    }
  });
  checkList('payments', (p, i)=>{
    if(!billIds.has(p.billId)) return bad('payments', i, 'bill');
    if(!isValidISODate(p.occurrenceDate)) return bad('payments', i, 'date');
    if(!isValidISODate(p.paymentDate)) return bad('payments', i, 'date');
    if(!isFiniteNumberValue(p.amount) || Number(p.amount) <= 0 || Number(p.amount) > MAX_AMOUNT) return bad('payments', i, 'amount');
    if(!pmIds.has(p.paymentMethodId)) return bad('payments', i, 'paymentMethod');
    if(!isValidNotesString(p.notes, MAX_NOTES_LEN)) return bad('payments', i, 'notes');
  });
  return errors;
}

/* ---------- Central store ---------- */
const STORE = {
  state: null,
  storageWasEmpty: false,
  loadWarning: false,
  load(){
    let raw = null;
    let storageReadOk = true;
    try{ raw = localStorage.getItem(APP_STORAGE_KEY); }
    catch(e){ storageReadOk = false; console.warn('localStorage unavailable', e); }
    if(raw){
      let parsed = null;
      try{ parsed = JSON.parse(raw); }
      catch(e){ console.warn('Stored data was corrupted JSON, starting fresh.', e); }
      if(parsed && validateStateShape(parsed).length === 0){
        this.state = migrateState(parsed);
        setSaveIndicator(true);
        return;
      }
      // Unreadable data is never silently discarded: keep a recovery copy.
      try{ localStorage.setItem(APP_STORAGE_KEY + '__recovery', raw); }catch(e){ console.warn('Could not keep recovery copy', e); }
      this.loadWarning = true;
    }
    this.state = defaultState();
    this.storageWasEmpty = storageReadOk && raw === null;
    setSaveIndicator(storageReadOk ? null : false);
  },
  save(){
    const previousLastSaved = this.state && this.state.meta ? this.state.meta.lastSaved : null;
    try{
      const savedAt = nowISO();
      this.state.meta.lastSaved = savedAt;
      const payload = JSON.stringify(this.state);
      localStorage.setItem(APP_STORAGE_KEY, payload);
      const persisted = localStorage.getItem(APP_STORAGE_KEY);
      if(persisted !== payload) throw new Error('localStorage verification failed');
      setSaveIndicator(true);
      return true;
    }catch(e){
      if(this.state && this.state.meta) this.state.meta.lastSaved = previousLastSaved;
      console.error('Failed to save to localStorage', e);
      setSaveIndicator(false);
      toast(t('backup.saveFailedWarning'), 'error');
      return false;
    }
  },
  mutate(fn){
    let before = null;
    try{
      before = JSON.stringify(this.state);
      fn(this.state);
    }catch(e){
      console.error('Mutation failed', e);
      if(before){ try{ this.state = JSON.parse(before); }catch(_){ } }
      toast(t('backup.saveFailedWarning'), 'error');
      this.render();
      return false;
    }
    const saved = this.save();
    if(!saved && before){
      try{ this.state = JSON.parse(before); }catch(e){ console.error('Could not restore state after failed save', e); }
    }
    this.render();
    return saved;
  },
  render(){ invalidateDerived(); renderApp(); }
};

/* ============================================================
   STORAGE MIGRATION — ordered, idempotent schema upgrades.
   Add a new entry to SCHEMA_MIGRATIONS for each future version.
   The retired Personal Budget Planner store is never read.
   ============================================================ */
const SCHEMA_MIGRATIONS = {
  // v1 (Phase 1 foundation) -> v2: seeded categories/methods, ISO currency code, due-soon window.
  2(state){
    if(!Array.isArray(state.categories) || !state.categories.length) state.categories = seedCategories();
    if(!Array.isArray(state.paymentMethods) || !state.paymentMethods.length) state.paymentMethods = seedPaymentMethods();
    state.settings = state.settings || {};
    if(!state.settings.currencyCode || CURRENCY_CODES.indexOf(state.settings.currencyCode) === -1){
      state.settings.currencyCode = LEGACY_SYMBOL_TO_CODE[state.settings.currencySymbol] || 'USD';
    }
    if(state.settings.dueSoonDays === undefined) state.settings.dueSoonDays = 7;
    return state;
  },
  // v2 -> v3: the End Date feature was retired. A legacy end date that has already
  // passed is preserved as the bill's archive date (the existing mechanism that stops
  // new due dates while keeping all history), so no bill starts producing new due
  // dates unexpectedly. Future/invalid legacy end dates are dropped. Bills, payments
  // and payment history are never removed.
  3(state){
    const today = todayISO();
    (Array.isArray(state.bills) ? state.bills : []).forEach(b=>{
      if(!isPlainObject(b) || !Object.prototype.hasOwnProperty.call(b, 'endDate')) return;
      const end = b.endDate;
      if(isValidISODate(end) && end < today){
        if(!b.archived){ b.archived = true; b.active = false; b.archivedAt = end; }
        else if(!isValidISODate(b.archivedAt) || end < b.archivedAt){ b.archivedAt = end; }
      }
      delete b.endDate;
    });
    return state;
  }
};
function migrateState(obj){
  // Only call this after validateStateShape() succeeds.
  let state = obj;
  let from = Number(obj.meta && obj.meta.schemaVersion) || 1;
  for(let v = from + 1; v <= APP_SCHEMA_VERSION; v++){
    if(SCHEMA_MIGRATIONS[v]) state = SCHEMA_MIGRATIONS[v](state);
  }
  const base = defaultState();
  const out = Object.assign({}, base, state);
  STATE_ARRAY_KEYS.forEach(k=>{ if(!Array.isArray(out[k])) out[k] = base[k]; });
  out.settings = Object.assign({}, base.settings, state.settings||{});
  out.preferences = Object.assign({}, base.preferences, state.preferences||{});
  out.meta = Object.assign({}, base.meta, state.meta||{}, { app: APP_ID, schemaVersion: APP_SCHEMA_VERSION });
  // Normalise optional record fields so every engine can rely on them.
  out.bills.forEach(b=>{
    if(!isPlainObject(b.overrides)) b.overrides = {};
    b.autoPay = !!b.autoPay; b.archived = !!b.archived; b.active = !b.archived;
    if(!b.archived) b.archivedAt = '';
    else if(!b.archivedAt) b.archivedAt = todayISO();
    if(!b.paymentMethodId) b.paymentMethodId = '';
    if(typeof b.notes !== 'string') b.notes = '';
    b.amount = round2(Number(b.amount));
  });
  out.payments.forEach(p=>{ p.amount = round2(Number(p.amount)); if(typeof p.notes !== 'string') p.notes = ''; });
  [out.categories, out.paymentMethods].forEach(list=>list.forEach(x=>{ x.archived = !!x.archived; if(typeof x.name !== 'string') x.name = ''; if(typeof x.key !== 'string') x.key = ''; }));
  return out;
}

function addRecord(arrName, record){
  record.id = record.id || uid(arrName);
  record.createdAt = record.createdAt || nowISO();
  record.updatedAt = nowISO();
  const saved = STORE.mutate(s => s[arrName].push(record));
  return saved ? record.id : null;
}
function updateRecord(arrName, id, patch){
  let found = false;
  const saved = STORE.mutate(s=>{
    const rec = s[arrName].find(r=>r.id===id);
    if(rec){ found = true; Object.assign(rec, patch, {updatedAt: nowISO()}); }
  });
  return found && saved;
}
function deleteRecord(arrName, id){
  const beforeCount = (STORE.state[arrName]||[]).length;
  const saved = STORE.mutate(s=>{ s[arrName] = s[arrName].filter(r=>r.id!==id); });
  return saved && (STORE.state[arrName]||[]).length < beforeCount;
}
function getRecord(arrName, id){
  return (STORE.state[arrName]||[]).find(r=>r.id===id) || null;
}

/* ---------- Validation helpers ---------- */
function isBlank(v){ return v===undefined || v===null || String(v).trim()===''; }
function isValidAmount(v){
  if(typeof v==='number') return Number.isFinite(v) && round2(v)>0;
  if(typeof v!=='string' || v.trim()==='') return false;
  const n = Number(v.trim());
  return Number.isFinite(n) && round2(n)>0;
}
function isValidNonNegativeAmount(v){
  if(typeof v==='number') return Number.isFinite(v) && round2(v)>=0;
  if(typeof v!=='string' || v.trim()==='') return false;
  const n = Number(v.trim());
  return Number.isFinite(n) && round2(n)>=0;
}
function isValidPositiveAmount(v){
  return isValidAmount(v);
}
function isValidDate(v){

}
function validateCustomDateRange(start, end){
